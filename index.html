// In-place re-renders replace the focused control; remember it so keyboard focus is not dropped to <body>.
function focusKey(){ const e=document.activeElement; if(!e||e===document.body||!$("#main").contains(e)) return null;
  if(e.id) return "#"+CSS.escape(e.id);
  const k=Object.keys(e.dataset)[0]; return k?`${e.tagName.toLowerCase()}[data-${k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())}="${CSS.escape(e.dataset[k])}"]`:null }
function restoreFocus(key,hadNext){
  if(document.activeElement&&document.activeElement!==document.body) return;
  const nx=!hadNext&&$("#main").querySelector("[data-snext],[data-qnext]"); if(nx) return nx.focus({preventScroll:true});
  const same=$("#main").querySelector(key); if(!same) return;
  if(!same.disabled) return same.focus({preventScroll:true});
  const all=[...$("#main").querySelectorAll("button:not([disabled]),[href],input,[tabindex='0']")];
  const after=all.find(x=>same.compareDocumentPosition(x)&Node.DOCUMENT_POSITION_FOLLOWING); if(after) after.focus({preventScroll:true});
}
let knobDragging=false, knobStart=null;
// Flow dial drag: up or right turns it up, down or left turns it down; one 0.5 L/min step per DIAL_STEP_PX of movement.
const DIAL_STEP_PX=28;
function dialFlow(start,e){ const d=(e.clientX-start.x)-(e.clientY-start.y); return Math.min(5,Math.max(0,start.f+Math.trunc(d/DIAL_STEP_PX)*.5)) }
function knobFlowFromPointer(e){ return knobStart?dialFlow(knobStart,e):null }

document.addEventListener("pointermove",e=>{ if(!knobDragging) return; const v=knobFlowFromPointer(e); if(v!=null) setKnobFlow(v); });

const ACT={};

/* 1. Find and classify */
const A1T=["flowmeter","humidifier","compressor","filter","opi","sieves"];

  fallback:L=>{const t=A1T[L.i]||"flowmeter"; return deviceSVG({view:PART[t].view,st:{...OK_STATE},hi:L.phase==="classify"?t:null})},
  pick(L,id){ if(L.phase!=="find") return; const t=A1T[L.i];

  act(L,v){ const t=A1T[L.i];

    if(v==="user"||v==="bio"){ const ok=PART[t].who===v; if(ok) L.pts+=1; L.ans=v;
      L.msg={k:ok?"ok":"bad",h:ok?tx("Correct.","Exact."):tx("Not quite.","Pas tout à fait."),b:PART[t].who==="user"?tx("Ward staff check this part. ","Le personnel du service vérifie cette pièce. ")+PART[t].checks[0]:tx("Only trained biomedical staff work on this part. It sits inside the casing, which users never open.","Seul le personnel biomédical formé intervient sur cette pièce. Elle se trouve dans le boîtier, que les utilisateurs n'ouvrent jamais.")} }
    if(v==="next"){ L.i++; L.tries=0; L.ans=null; L.msg=null; L.phase=L.i>=A1T.length?"done":"find"; if(L.phase==="done"){L.score=Math.round(L.pts/(A1T.length*2)*100); recordLab("a1",L.score)} } },
  panel(L){

      <div class="row" style="justify-content:space-between"><span class="eyebrow">${tx("Part","Pièce")} ${L.i+1} / ${A1T.length}</span>${stepDots(A1T.length,L.i)}</div>

        <p class="muted small">${PART[t].view==="inside"?tx("The casing is open for this one.","Le boîtier est ouvert pour celle-ci."):tx("Rotate the model if you need to. Names stay hidden until you find it.","Faites tourner le modèle si besoin. Les noms restent cachés jusqu'à ce que vous trouviez.")}</p>
        ${msgBox(L.msg)}<div class="row"><button class="btn quiet" data-la="reveal">${tx("Show me","Montrez-moi")}</button></div>`
      :`${msgBox(L.ans?null:L.msg)}<h3>${tx("Who may handle the","Qui peut intervenir sur :")} ${PART[t].name.toLowerCase()}${tx("?"," ?")}</h3>
        <div class="opts">${(()=>{const W=[["user",tx("Ward staff can check it","Le personnel du service peut la vérifier")],["bio",tx("Biomedical staff only","Personnel biomédical uniquement")]];
          return dispOrder(2,"a1:"+t,W.findIndex(w=>w[0]===PART[t].who)).map((i,pos)=>{const [k,lbl]=W[i];return `<button class="opt ${L.ans?(PART[t].who===k?"right":L.ans===k?"wrong":"faded"):""}" data-la="${k}" ${L.ans?"disabled":""}><span class="k">${"AB"[pos]}</span><span>${lbl}</span></button>`}).join("")})()}</div>

/* 2. Follow the gas */

  w:["The beds take turns. One traps nitrogen under pressure while the other purges it. That swap is the regular hiss you hear.","Les tamis alternent. L'un retient l'azote sous pression pendant que l'autre le purge. Cette alternance produit le sifflement régulier que vous entendez."]},
 {q:["What does the zeolite in the sieve beds trap?","Que retient la zéolithe des tamis ?"],
  o:[["Nitrogen","L'azote"],["Oxygen","L'oxygène"],["Only water vapour","Seulement la vapeur d'eau"],["Dust","La poussière"]],a:0,
  w:["Zeolite holds nitrogen under pressure and lets oxygen pass. Moisture and dust damage it, which is why filters and dry storage matter.","La zéolithe retient l'azote sous pression et laisse passer l'oxygène. L'humidité et la poussière l'abîment, d'où l'importance des filtres et d'un stockage au sec."]}
];
ACT.a2={
  init:()=>({id:"a2",k:0,mist:0,phase:"trace",msg:null,qa:[]}),
  viewer:L=>({mode:"airflow",airStep:L.phase==="trace"?(L.k?A2STEP[L.k-1]:-1):5,hi:A2S.slice(0,L.k),lbl:L.k?[A2S[L.k-1]]:[],dim:false,tips:true,bar:["front","side","back","labels","reset"]}),
  listIds:()=>["fan","board","inletfilter","compressor","valve","sieves","tank","flowmeter","humidifier","vents"],
  fallback:L=>deviceSVG({view:"inside",hi:A2S.slice(0,L.k),airStep:L.phase==="trace"?(L.k?A2STEP[L.k-1]:null):5,interactive:false}),
  pick(L,id){ if(L.phase!=="trace"||L.ack) return; const want=A2S[L.k];
    if(id===want){ const prev=L.k?A2STEP[L.k-1]:-1; L.k++; const s=A2STEP[L.k-1]; flash(id,true);
      L.msg=s!==prev?{k:"ok",h:AIRFLOW[s].t+".",b:AIRFLOW[s].d}:{k:"ok",h:tx("Correct.","Exact."),b:itemName(id)+tx(" is next on the way."," est l'étape suivante.")};
      L.ack=true; }   // feedback stays with the stop just found; the next prompt appears on "Next stop"
    else{ L.mist++; flash(id,false); const at=A2S.indexOf(id);
      L.msg={k:"bad",h:tx("Not yet.","Pas encore."),b:at>L.k?tx("Air reaches that part later.","L'air atteint cette pièce plus tard."):at>=0?tx("Air has already passed that part.","L'air a déjà traversé cette pièce."):tx("The gas does not pass through that part on its way to the patient.","Le gaz ne traverse pas cette pièce en allant vers le patient.")} } },
  act(L,v){
    if(v==="cont"){ L.ack=false; L.msg=null; if(L.k===A2S.length){ L.phase="q0"; L.msg={k:"info",h:AIRFLOW[5].t+".",b:AIRFLOW[5].d} } }
    if(v==="hint"){ L.mist++; L.msg={k:"info",h:tx("Next stop:","Prochaine étape :"),b:itemName(A2S[L.k])+"."}; flash(A2S[L.k],true) }
    if(v.startsWith("q:")){ const qi=L.phase==="q0"?0:1; L.qa[qi]=+v.slice(2) }
    if(v==="qnext"){ if(L.phase==="q0") L.phase="q1"; else { L.phase="done"; const tr=Math.max(0,A2S.length-L.mist)/A2S.length*60; L.score=Math.round(tr+(L.qa[0]===A2Q[0].a?20:0)+(L.qa[1]===A2Q[1].a?20:0)); recordLab("a2",L.score) } } },
  panel(L){
    if(L.phase==="done") return finishPanel(L,L.score,tx("Filter, compress, trap the nitrogen, store, then deliver. Two sieve beds take turns, which is the hiss you hear every few seconds.","Filtrer, comprimer, retenir l'azote, stocker, puis délivrer. Deux tamis alternent, d'où le sifflement toutes les quelques secondes."));
    if(L.phase==="trace"&&L.ack) return `<div class="panel q">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">${tx("Stop","Étape")} ${L.k} / ${A2S.length}</span>${stepDots(A2S.length,L.k)}</div>
      <h3><span class="chip ok" style="display:inline-grid;vertical-align:-5px;margin-right:8px">${CHK}</span>${tx("Correct:","Exact :")} ${itemName(A2S[L.k-1])}</h3>
      ${msgBox(L.msg)}
      <ol class="clean trail">${A2S.slice(0,L.k).map(id=>`<li>${itemName(id)}</li>`).join("")}</ol>
      <div class="row"><button class="btn" data-la="cont">${L.k<A2S.length?tx("Next stop","Étape suivante")+" <span aria-hidden=\"true\">→</span>":tx("Continue to the questions","Passer aux questions")}</button></div></div>`;
    if(L.phase==="trace") return `<div class="panel q">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">${tx("Stop","Étape")} ${L.k+1} / ${A2S.length}</span>${stepDots(A2S.length,L.k)}</div>
      <h3>${L.k===0?tx("Where does room air enter the machine? Tap that part.","Par où l'air de la pièce entre-t-il ? Touchez cette pièce."):tx("Tap the part the gas reaches next.","Touchez la pièce que le gaz atteint ensuite.")}</h3>
      <p class="muted small">${tx("The casing is see-through.","Le boîtier est transparent.")}${matchMedia("(hover:hover)").matches?" "+tx("Point at a part to see its name.","Pointez une pièce pour voir son nom."):""}</p>
      ${L.k?`<ol class="clean trail">${A2S.slice(0,L.k).map(id=>`<li>${itemName(id)}</li>`).join("")}</ol>`:""}
      ${L.msg&&L.msg.k!=="ok"?msgBox(L.msg):""}<div class="row"><button class="btn quiet" data-la="hint">${tx("Hint","Indice")}</button>${L.mist?`<span class="small muted">${tx("Wrong taps:","Erreurs :")} ${L.mist}</span>`:""}</div></div>`;

/* 3. Read the panel */
const A3R=["red","noflow","temp","pwr"], A3I=["opi","hours","flowmeter"];
function reading(id,s){
  const on=s.power;
  if(id==="opi") return on?tx("Purity light: ","Voyant de pureté : ")+colourName(s.opi):tx("Purity lights: all off","Voyants de pureté : tous éteints");
  if(id==="hours") return !on?tx("Display: blank","Écran : vide"):s.alarm&&ALARM_TXT[s.alarm]?tx("Display: ","Écran : ")+ALARM_TXT[s.alarm]:tx("Display: running hours only","Écran : heures de fonctionnement seulement");
  if(id==="flowmeter") return on&&!s.blocked?`${tx("Flow:","Débit :")} ${s.flow} L/min, ${tx("ball steady","bille stable")}`:tx("Ball at 0 although the knob is open","Bille à 0 alors que le bouton est ouvert");
  return "";
}
ACT.a3={
  init:()=>({id:"a3",r:0,seen:{},phase:"inspect",pick:null,pts:0,msg:null}),
  W:L=>WARNINGS.find(w=>w.id===A3R[L.r]),
  viewer(L){const w=this.W(L)||WARNINGS[0]; return {mode:"front",device:w.st,cam:"panel",tips:true,good:Object.keys(L.seen)}},
  listIds:()=>["opi","hours","flowmeter","alarm","power","humidifier"],
  fallback(L){const w=this.W(L)||WARNINGS[0]; return deviceSVG({st:{...OK_STATE,...w.st}})},
  pick(L,id){ if(L.phase==="done") return; const w=this.W(L);
    if(A3I.includes(id)){ L.seen[id]=true; flash(id,true); L.msg=null; if(L.phase==="inspect"&&A3I.every(x=>L.seen[x])) L.phase="answer" }
    else L.msg={k:"info",h:itemName(id)+".",b:tx("Look at the purity lights, the display and the flowmeter. They tell you most.","Regardez les voyants de pureté, l'écran et le débitmètre. Ce sont eux qui renseignent le plus.")} },
  act(L,v){ const w=this.W(L);
    if(v==="skip"){ L.phase="answer"; L.msg=null }
    if(v.startsWith("ans:")){ L.pick=+v.slice(4); if(w.q1.o[L.pick].c===1) L.pts++; L.phase="fb" }
    if(v==="next"){ L.r++; L.seen={}; L.pick=null; L.msg=null; L.phase=L.r>=A3R.length?"done":"inspect"; if(L.phase==="done"){L.score=Math.round(L.pts/A3R.length*100); recordLab("a3",L.score)} }
    if(v==="tone"&&w.tone) playTone(w.tone) },
  panel(L){
    if(L.phase==="done") return finishPanel(L,L.score,tx("Read three things before you act: the purity lights, the display and the flow ball. Together they tell power, purity and flow problems apart.","Lisez trois choses avant d'agir : les voyants de pureté, l'écran et la bille. Ensemble, ils distinguent les problèmes d'alimentation, de pureté et de débit."));
    const w=this.W(L);
    const checks=A3I.map(id=>`<li class="${L.seen[id]?"got":""}"><span class="chip${L.seen[id]?" ok":""}">${L.seen[id]?CHK:"?"}</span><span>${L.seen[id]?reading(id,{...OK_STATE,...w.st}):itemName(id)+tx(": not checked yet",": pas encore vérifié")}</span></li>`).join("");
    let body="";
    if(L.phase==="inspect") body=`<p>${tx("Tap the purity lights, the display and the flowmeter on the model to inspect them.","Touchez les voyants de pureté, l'écran et le débitmètre sur le modèle pour les inspecter.")}</p>${msgBox(L.msg)}<div class="row"><button class="btn quiet" data-la="skip">${tx("Skip inspection","Passer l'inspection")}</button></div>`;
    else{ const o=L.pick!=null?w.q1.o[L.pick]:null, best=w.q1.o.find(x=>x.c===1);
      body=`<h3>${w.q1.q}</h3><div class="opts">${w.q1.o.map((x,i)=>`<button class="opt ${o?(x.c===1?"right":i===L.pick?"wrong":"faded"):""}" data-la="ans:${i}" ${o?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${x.t}</span></button>`).join("")}</div>
      ${o?`<div class="callout ${o.c===1?"ok":"bad"}"><strong>${o.c===1?tx("Correct.","Exact."):tx("Not quite.","Pas tout à fait.")}</strong> ${o.f}${o.c!==1?` <br><strong>${tx("Best answer:","Meilleure réponse :")}</strong> ${best.t}`:""}</div><div class="row"><button class="btn" data-la="next">${L.r<A3R.length-1?tx("Next alarm","Alarme suivante"):tx("See score","Voir le score")}</button></div>`:""}`; }
    return `<div class="panel q">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">${tx("Alarm","Alarme")} ${L.r+1} / ${A3R.length}</span>${stepDots(A3R.length,L.r)}</div>
      <p>${w.context}</p>
      <div class="row"><span class="soundchip"><span aria-hidden="true">🔊</span>${w.sound}</span>${w.tone?`<button class="btn quiet" data-la="tone">${tx("Play alarm","Écouter l'alarme")}</button>`:""}</div>
      <ul class="clean readings">${checks}</ul>${body}</div>`;
  }
};

function a4Spo2(L){ const C=A4C[L.c]; return Math.max(C.floor,C.start-Math.floor((Date.now()-L.t0)/2500)) }
ACT.a4={
  init:()=>({id:"a4",c:0,plan:[],phase:"plan",t0:Date.now(),run:0,pts:0,tagged:false,res:[]}),

    if(v==="go"&&L.plan.length===4){ L.spo2=a4Spo2(L); L.at=L.spo2; L.phase="run"; L.run=0; L.backed=false; a4Run(L) }

        <div class="vitals"><div class="vital ${cls}" id="labSpo2Box"><b id="labSpo2">${sp}</b><small>SpO₂ %</small></div></div></div>
      <p>${w.context} ${L.phase==="plan"?`<strong>${tx("SpO₂ is drifting down while you plan.","La SpO₂ baisse pendant que vous préparez.")}</strong>`:""}</p>
      <h3>${tx("Your plan","Votre plan")}</h3><ol class="clean slots">${slots}</ol>
      ${L.phase==="plan"?`<p class="small muted">${tx("Tap actions in the order you would do them. Tap a step to remove it.","Touchez les actions dans l'ordre où vous les feriez. Touchez une étape pour la retirer.")}</p>
        <div class="cardpool">${C.cards.map(k=>`<button class="pcard" data-la="add:${k}" ${L.plan.includes(k)||L.plan.length>=4?"disabled":""}>${tx(A4CARDS[k][0],A4CARDS[k][1])}</button>`).join("")}</div>

function a4Run(L){
  const C=A4C[L.c];
  const tick=()=>{ if(ui.lab!==L||L.phase!=="run") return;
    const k=L.plan[L.run];
    if(k==="backup") L.backed=true;
    if(k==="tag") L.tagged=true;
    L.spo2=L.backed?Math.min(C.target,L.spo2+3):Math.max(C.floor,L.spo2-1);
    L.run++;
    if(L.run>=4){ L.res=L.plan.map((k,i)=>C.order[i].includes(k)); L.pts+=L.res.filter(Boolean).length; L.phase="fb" }
    render(); if(L.phase==="run") setTimeout(tick,1100) };
  render(); setTimeout(tick,900);
}

const P3W=["red","pwr"];
ACT.p3={
  init:()=>({id:"p3",c:0,seen:{},phase:"inspect",pick:null,plan:[],t0:Date.now(),run:0,pts:0,tagged:false,res:[],msg:null}),

  viewer(L){const C=A4C[Math.min(L.c,1)]; return {mode:"front",device:C.dev,tag:L.tagged,cam:L.phase==="inspect"||L.phase==="answer"?"panel":"front",tips:true,good:Object.keys(L.seen)}},

  },
  panel(L){

      else { const o=L.pick!=null?w.q1.o[L.pick]:null, best=w.q1.o.find(x=>x.c===1);
        body=`<h3>${w.q1.q}</h3><div class="opts">${w.q1.o.map((x,i)=>`<button class="opt ${o?(x.c===1?"right":i===L.pick?"wrong":"faded"):""}" data-la="ans:${i}" ${o?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${x.t}</span></button>`).join("")}</div>
        ${o?`<div class="callout ${o.c===1?"ok":"bad"}"><strong>${o.c===1?tx("Correct.","Exact."):tx("Not quite.","Pas tout à fait.")}</strong> ${o.f}${o.c!==1?` <br><strong>${tx("Best answer:","Meilleure réponse :")}</strong> ${best.t}`:""}</div>
        <div class="row"><button class="btn" data-la="toPlan">${tx("Plan your response","Planifier votre réponse")}</button></div>`:""}`; }
      return `<div class="panel q">${head}<ul class="clean readings">${checks}</ul>${body}</div>`;
    }

    <button class="actline-st" data-stage="${st.id}"><span class="jicon">${icon(st.id,18)}</span>${tx(st.n[0],st.n[1])}</button>
    <span class="actline-pos">${tx("Activity","Activité")} ${i+1} ${tx("of","sur")} ${list.length}<span aria-hidden="true"> · </span><b>${stepTitle(cur)}</b></span>
    <span class="actline-nav">${prev?`<button class="btn quiet sm" data-step="${prev}" aria-label="${tx("Previous","Précédent")}: ${stepTitle(prev)}">‹ ${tx("Previous","Précédent")}</button>`:""}${next?`<button class="btn quiet sm" data-step="${next}" aria-label="${tx("Next","Suivant")}: ${stepTitle(next)}">${tx("Next","Suivant")} ›</button>`:""}</span>
  </nav>`;
}
V.stage=()=>{
  const st=STAGES.find(s=>s.id===ui.stage)||STAGES[1], p=prog(), n=STAGES.indexOf(st)+1, first=st.steps.find(s=>stepFrac(s,p)!=null&&!stepDone(s,p))||st.steps[0];
  return `<div class="view chapter">
    <div class="head"><h2><span class="vh">${tx("Stage","Étape")} ${n} ${tx("of","sur")} ${STAGES.length}${tx(": "," : ")}</span>${tx(st.n[0],st.n[1])}</h2><p class="muted">${tx(st.intro[0],st.intro[1])}</p></div>
    <ol class="clean stepcards">${st.steps.map((s,i)=>{const f=stepFrac(s,p), done=f!=null&&f>=1, inprog=!done&&stepInProgress(s);
      return `<li><button class="stepcard" data-step="${s}"><span class="sc lg${done?" done":inprog?" cur":""}">${done?CHK:i+1}</span><span class="st"><b>${stepTitle(s)}${OPTIONAL_STEPS.includes(s)?` <span class="j-opt">${tx("Optional","Facultatif")}</span>`:""}</b><span>${stepDesc(s)}</span></span>
        <span class="ss">${f==null?"":done?`<span class="pill best">${tx("Done","Fait")}</span>`:inprog?`<span class="pill ok">${tx("In progress","En cours")}</span>`:f>0?`<span class="pill ok">${pct(f)} %</span>`:`<span class="pill user" style="background:var(--accent-soft);color:var(--accent-ink)">${tx("Start","Commencer")}</span>`}</span></button></li>`}).join("")}</ol>
    <div class="row">${stageFrac(st,p)>=1?nextStepButton(st.steps.filter(s=>FLAT.includes(s)).slice(-1)[0]):`<button class="btn" data-step="${first}">${stepInProgress(first)&&!stepDone(first,p)?tx("Resume","Reprendre"):tx("Continue with","Continuer avec")} ${stepTitle(first)}</button>`}</div></div>`;
};
V.record=()=>{
  const p=prog(), L=S.lab||{};
  const COV={a1:[1],p1:[2],p4:[3,4]};
  const pillFor=(sc,id)=>sc==null?(stepInProgress(id)?`<span class="pill state">${tx("In progress","En cours")}</span>`:`<span class="pill user" style="background:var(--surface-2);color:var(--muted)">${tx("Not started","Pas commencé")}</span>`):sc>=70?`<span class="pill best">${tx("Competent","Compétent")}</span>`:`<span class="pill ok">${tx("Practise again","À refaire")}</span>`;
  const row=id=>{const sc=L[id]; return `<tr><td><button class="linkbtn" data-step="${id}">${stepTitle(id)}</button><br><span class="small muted obj">${COV[id].length>1?tx("Objectives","Objectifs"):tx("Objective","Objectif")} ${COV[id].join(", ")}</span></td><td class="num">${sc==null?`<span aria-hidden="true">–</span><span class="vh">${tx("No score yet","Pas encore de score")}</span>`:sc+" %"}</td><td>${pillFor(sc,id)}</td></tr>`};
  const rows=["a1","p1","p4"].map(row).join("");
  const actS=SCENARIOS.filter(s=>s.active!==false), wDone=drills().filter(w=>S.warn[w.id]!=null).length, scs=actS.map(s=>S.scen[s.id]).filter(x=>x!=null);
  const scAvg=scs.length?Math.round(scs.reduce((a,b)=>a+b,0)/scs.length):null;
  const lowCase=actS.map(s=>({s,r:S.scen[s.id]})).filter(x=>x.r!=null).sort((x,y)=>x.r-y.r)[0];
  const wAll=drills().every(w=>S.warn[w.id]!=null), scAll=actS.every(s=>S.scen[s.id]!=null);
  const attempted=L.a1!=null&&L.p1!=null&&L.p4!=null&&wAll&&scAll;   // "Training completed"
  const passed=attempted&&L.a1>=70&&L.p1>=70&&L.p4>=70&&scAvg>=70;
  const status=!attempted?"progress":passed?"passed":"review";
  // First required activity still to finish, in course order (same completion test as "attempted" above).
  const nextReq=FLAT.filter(s=>!OPTIONAL_STEPS.includes(s)).find(s=>!stepDone(s,p));
  const below=[...["a1","p1","p4"].filter(id=>L[id]<70).map(id=>`${stepTitle(id)} (${L[id]} %)`), ...(scAvg<70?[`${stepTitle("scenarios")} (${scAvg} %${lowCase&&lowCase.r<scAvg?`, ${tx("lowest:","le plus bas :")} ${lowCase.s.title} ${lowCase.r} %`:""})`]:[])];
  return `<div class="view">
    <div class="head page-head"><h2>${tx("Competency record","Bilan de compétences")}</h2><p class="small muted">${tx("Your best scores, saved in this browser only.","Vos meilleurs scores, enregistrés dans ce navigateur uniquement.")}</p></div>
    ${attempted?`<p><span class="pill state">${CHK} ${tx("Training completed","Formation terminée")}</span></p>`:""}
    ${status==="progress"?`<div class="callout warn slim rec-next"><span role="status"><strong>${tx("Training in progress.","Formation en cours.")}</strong> ${tx("Complete the remaining required activities.","Terminez les activités obligatoires restantes.")}</span>${nextReq?`<button class="btn sm" data-step="${nextReq}">${stepInProgress(nextReq)?tx("Resume","Reprendre"):tx("Continue with","Continuer avec")} ${stepTitle(nextReq)}</button>`:""}</div>`
      :status==="review"?`<div class="callout warn"><strong>${tx("Needs review","À revoir")}.</strong> ${tx("You've completed every activity. Reach the target in each one before moving on. Still below target:","Vous avez terminé toutes les activités. Atteignez l'objectif dans chacune avant de continuer. Encore sous l'objectif :")} ${below.join(", ")}.</div>`
      :`<div class="callout ok"><strong>${tx("Simulation passed","Simulation réussie")}.</strong> ${tx("Ask your ward lead or biomedical team to observe you setting up and checking a real device.","Demandez à votre responsable de service ou à l'équipe biomédicale de vous observer installer et vérifier un vrai appareil.")}</div>`}
    <section class="panel"><h3 style="margin-bottom:8px">${tx("Core practice","Pratique principale")}</h3><div class="tablewrap"><table class="rec"><thead><tr><th>${tx("Activity","Activité")}</th><th>${tx("Best score","Meilleur score")}</th><th>${tx("Status","Statut")}</th></tr></thead><tbody>${rows}</tbody></table></div>${["a1","p1","p4"].some(id=>L[id]==null)?`<p class="small muted rec-key"><span aria-hidden="true">– </span>${tx("No score yet. A score is recorded when you finish the activity.","Pas encore de score. Le score est enregistré quand vous terminez l'activité.")}</p>`:""}</section>
    <section class="panel"><h3 style="margin-bottom:8px">${tx("Respond: warnings and bedside cases","Réagir : alertes et cas au chevet")}</h3><div class="tablewrap"><table class="rec"><thead><tr><th>${tx("Activity","Activité")}</th><th>${tx("Progress","Progression")}</th><th><span class="vh">${tx("Link","Lien")}</span></th></tr></thead><tbody>
      <tr><td>${stepTitle("warnings")}</td><td class="num">${wDone} / ${drills().length}</td><td><button class="linkbtn" data-step="warnings">${tx("Open","Ouvrir")}</button></td></tr>
      <tr><td>${stepTitle("scenarios")}</td><td class="num">${scs.length} / ${actS.length}${scAvg!=null?` · ${tx("average","moyenne")} ${scAvg} % (${tx("target","objectif")} 70 %)`:""}</td><td><button class="linkbtn" data-step="scenarios">${tx("Open","Ouvrir")}</button></td></tr>
    </tbody></table></div></section></div>`;
};
/* ---------- Phase 2: hotspot content (realistic model) ---------- */
// Clinical guidance validated by three medical doctors and a nurse. Device details (the "review" box) vary by model.
const HS_INFO={
 power:{n:["Power switch","Interrupteur marche/arrêt"],
  f:["Turns the concentrator on and off. On the model shown, it is the button with the power symbol on the front control panel.","Met le concentrateur en marche et l'arrête. Sur le modèle présenté, c'est le bouton portant le symbole marche/arrêt sur le panneau de commande avant."],
  s:[["Plug the device straight into a grounded wall socket, not an extension lead or shared adaptor.","Branchez l'appareil directement sur une prise murale reliée à la terre, pas sur une rallonge ni une multiprise."],
     ["After switching on, wait until the device shows normal oxygen purity before relying on it. How long this takes depends on the model.","Après la mise en marche, attendez que l'appareil indique une pureté d'oxygène normale avant de vous y fier. Ce délai dépend du modèle."],
     ["If the device switches off unexpectedly, move the patient to backup oxygen first, then look for the cause.","Si l'appareil s'arrête de façon inattendue, passez d'abord le patient sur l'oxygène de secours, puis cherchez la cause."]],
  r:["how the button works (single press or press-and-hold), the start-up time, and the electrical requirements.","le fonctionnement du bouton (appui simple ou prolongé), le délai de démarrage et les exigences électriques."]},
 flowmeter:{n:["Flowmeter","Débitmètre"],
  f:["Sets and shows the oxygen flow delivered to the patient in litres per minute (L/min). The float rises in the tube as the flow increases.","Règle et affiche le débit d'oxygène délivré au patient, en litres par minute (L/min). Le flotteur monte dans le tube quand le débit augmente."],
  s:[["Set only the flow on the clinician's prescription.","Réglez uniquement le débit prescrit par le clinicien."],
     ["Read the flow at the point on the float that the manual specifies. Many ball floats are read at the centre of the ball.","Lisez le débit au point du flotteur indiqué par le manuel. Pour beaucoup de flotteurs à bille, c'est le centre de la bille."],
     ["Recheck the setting whenever the device has been moved or bumped.","Revérifiez le réglage chaque fois que l'appareil a été déplacé ou heurté."],
     ["Do not go above the maximum flow stated by the manufacturer. Purity can fall at higher flows.","Ne dépassez pas le débit maximal indiqué par le fabricant. La pureté peut baisser à débit élevé."]],
  r:["the flow range, where to read the float, and the maximum rated flow.","la plage de débit, le point de lecture du flotteur et le débit maximal."]},
 humidifier:{n:["Humidifier bottle","Flacon humidificateur"],
  f:["Holds water that adds moisture to the oxygen before it reaches the patient. Bubbles in the water show that oxygen is passing through it.","Contient de l'eau qui humidifie l'oxygène avant qu'il n'atteigne le patient. Les bulles dans l'eau montrent que l'oxygène le traverse."],
  s:[["Use it only when your protocol calls for humidification.","Utilisez-le seulement quand votre protocole prévoit une humidification."],
     ["Fill it with the type of water your protocol specifies, between the minimum and maximum marks.","Remplissez-le avec le type d'eau prévu par votre protocole, entre les repères minimum et maximum."],
     ["Close the lid firmly. A loose lid can leak, and the patient then receives less oxygen.","Fermez bien le couvercle. Un couvercle mal serré peut fuir, et le patient reçoit alors moins d'oxygène."],
     ["Change the water and clean the bottle as your protocol directs.","Changez l'eau et nettoyez le flacon selon votre protocole."]],
  r:["the type of water to use, the fill marks, and the cleaning and replacement schedule.","le type d'eau à utiliser, les repères de remplissage, et le calendrier de nettoyage et de remplacement."]},
 alarm:{n:["Alarm indicators","Indicateurs d'alarme"],
  f:["Warn staff when the device detects a problem. On the model shown, warning symbols appear along the bottom of the display. Many concentrators also sound an audible alarm.","Avertissent le personnel quand l'appareil détecte un problème. Sur le modèle présenté, des symboles d'alerte apparaissent en bas de l'écran. Beaucoup de concentrateurs émettent aussi une alarme sonore."],
  s:[["When an alarm activates, check the patient first, then the device.","Quand une alarme se déclenche, vérifiez d'abord le patient, puis l'appareil."],
     ["If you cannot quickly confirm that the patient is getting enough oxygen, switch to backup oxygen.","Si vous ne pouvez pas confirmer rapidement que le patient reçoit assez d'oxygène, passez sur l'oxygène de secours."],
     ["Do not silence an alarm without finding and dealing with its cause.","Ne coupez pas une alarme sans en trouver et traiter la cause."],
     ["Learn what each symbol and sound means on the devices used on your ward.","Apprenez ce que signifie chaque symbole et chaque son sur les appareils de votre service."]],
  r:["what each symbol and sound means, the alarm conditions and thresholds, and how to silence or reset alarms.","la signification de chaque symbole et de chaque son, les conditions et seuils d'alarme, et la façon de couper ou réinitialiser une alarme."]}
};
function hsName(id){ const h=HS_INFO[id]; return h?tx(h.n[0],h.n[1]):id }
function hsPanel(id){
  const h=HS_INFO[id];
  return `<div class="panel partcard hspanel" aria-live="polite">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">${tx("Component","Composant")}</span>
      <button class="btn quiet" data-rhsclose="1" style="padding:5px 12px;font-size:13px">${tx("Close","Fermer")}</button></div>
    <h2 id="hsTitle" tabindex="-1">${tx(h.n[0],h.n[1])}</h2>
    <p class="partfn">${tx(h.f[0],h.f[1])}</p>
    <details class="whymatters"><summary>${tx("Why it matters","Pourquoi c\'est important")}</summary>
      <ul class="clean checks">${h.s.map(s=>`<li>${tx(s[0],s[1])}</li>`).join("")}</ul>
    </details>
    <div class="review"><strong>${tx("Device details vary.","Les appareils varient.")}</strong> ${tx("The guidance above is clinically validated. Check the manufacturer's manual for your device, in particular:","Les conseils ci-dessus sont validés cliniquement. Vérifiez dans le manuel du fabricant de votre appareil, en particulier :")} ${tx(h.r[0],h.r[1])}</div>
  </div>`;
}
const h=(location.hash||"").slice(1);
ui.view="title";
if(STAGES.some(s=>s.id===h)&&h!=="explore"){ ui.view="stage"; ui.stage=h } else if(h==="lab"){ ui.view="stage"; ui.stage="practice" } else if(V[h]) ui.view=h;
S.seen.flowmeter=S.seen.flowmeter||false;
render();
</script>
