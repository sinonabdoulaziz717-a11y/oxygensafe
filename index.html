<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="OxygenSafe: an interactive, bilingual 3D simulation for safe oxygen concentrator use at the bedside. Clinical content validated by three medical doctors and a nurse.">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>OxygenSafe: Oxygen concentrator safety training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: an instrument bench. Sticky header with module tabs; each module is a two-pane bench (device on the left, guidance on the right) that stacks on phones. */
:root{
  /* Palette: navy #14283F, clinical teal #087F8C, pale teal #EAF5F6, background #F7FAFC, caution amber #E5A23C.
     Teal fills buttons; --accent-ink (deeper teal) carries small text on tinted surfaces for 4.5:1 contrast. Amber is never used for text. */
  --bg:#F7FAFC; --surface:#FFFFFF; --surface-2:#F0F5F8; --line:#D3DEE6;
  --fg:#14283F; --muted:#4E6175; --accent:#087F8C; --accent-ink:#06646E; --accent-fg:#FFFFFF; --accent-soft:#EAF5F6;
  --amber:#E5A23C; --ok:#1D7A4E; --ok-bg:#E5F3EB; --warn:#7A4E06; --warn-bg:#FBF1DE; --bad:#B42318; --bad-bg:#FCEAE8;
  --dev-body:#f8f9f7; --dev-edge:#aab5c0; --dev-panel:#24303c; --dev-dark:#3b4856; --dev-metal:#9aa6b1;
  --water:#b9dcf3; --tube:#eef3f7; --lcd:#a9c3a4; --lcd-off:#56614f; --lcd-fg:#14240f;
  --display:"Manrope","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
/* Light is the default. Dark mode applies when the viewer chooses it (data-theme="dark"). */
:root[data-theme="dark"]{
  --bg:#0B1724; --surface:#13243A; --surface-2:#1A2E47; --line:#2B415C;
  --fg:#E6EDF4; --muted:#A5B4C4; --accent:#5CC6D0; --accent-ink:#5CC6D0; --accent-fg:#04262A; --accent-soft:#12383F;
  --ok:#6CD39C; --ok-bg:#12321F; --warn:#F1B864; --warn-bg:#3A2A10; --bad:#FF9C91; --bad-bg:#3E1B17;
  --dev-body:#cfd6dc; --dev-edge:#7e8a96; --dev-panel:#1a232d; --dev-dark:#33404c; --dev-metal:#8996a2;
  --water:#6aa3cc; --tube:#b7c3cd; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5.2vw,52px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(22px,3vw,30px);font-weight:750}
h3{font-size:19px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--body);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;font-stretch:80%}
.brand b{font-family:var(--display);font-size:18px;line-height:1;display:block}
.brand small{font-size:12px;color:var(--muted)}
.overall{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bar{width:110px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.lang button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:var(--mono)}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:none;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--fg);background:var(--surface)}
.tab[aria-current="page"]{background:var(--fg);color:var(--bg)}
.tab .tick{font-size:12px;color:var(--ok)}
.tab[aria-current="page"] .tick{color:inherit}

main{padding-block:24px 48px}
.view{display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-direction:column;gap:8px;max-width:70ch}

/* generic UI */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn{transition:background-color .15s,box-shadow .15s,transform .05s}
.btn:hover{background:var(--accent-ink)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.quiet{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.quiet:hover{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.btn:disabled,.btn:disabled:hover{opacity:.45;cursor:not-allowed;background:var(--accent);transform:none}
.btn.quiet:disabled,.btn.quiet:disabled:hover{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.pill.user{background:var(--ok-bg);color:var(--ok)}
.pill.bio{background:var(--warn-bg);color:var(--warn)}
.pill.best{background:var(--ok-bg);color:var(--ok)}
.pill.ok{background:var(--warn-bg);color:var(--warn)}
.pill.unsafe{background:var(--bad-bg);color:var(--bad)}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.callout{border-radius:10px;padding:12px 14px;font-size:15px}
.callout.ok{background:var(--ok-bg)} .callout.ok strong{color:var(--ok)}
.callout.bad{background:var(--bad-bg)} .callout.bad strong{color:var(--bad)}
.callout.warn{background:var(--warn-bg)} .callout.warn strong{color:var(--warn)}
.callout.info{background:var(--accent-soft)} .callout.info strong{color:var(--accent-ink)}
ul.clean,ol.clean{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
ul.checks li{display:flex;gap:10px}
ul.checks li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:2px;background:var(--accent)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:28px;align-items:center}
.hero .lede{font-size:18px;color:var(--muted);max-width:56ch}
.hero .device-mini{max-width:280px;justify-self:center;width:100%}
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.mod{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,transform .15s}
.mod:hover{border-color:var(--accent);transform:translateY(-2px)}
.mod .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mod p{font-size:14.5px;color:var(--muted);flex:1}
.mod .bar{width:100%}
.mod .prog{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.objectives{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 28px}
.objectives li{display:flex;gap:10px;font-size:15px}
.objectives li b{font-family:var(--mono);color:var(--accent);font-size:13px;padding-top:2px}
.disclaimer{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.disclaimer strong{color:var(--fg)}
.disclaimer .disc-i{flex:none;margin-top:1px;color:var(--accent-ink)}
.disc-b{min-width:0;display:flex;flex-direction:column;gap:2px}
.disc-more summary{cursor:pointer;width:fit-content;font-weight:600;font-size:13px;color:var(--accent-ink);padding:4px 0;list-style:revert}
.disc-more summary:hover{text-decoration:underline}
.disc-more p{margin-top:2px}

/* bench (two pane) */
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.stagebox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:120px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:7px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.svgwrap{display:flex;justify-content:center;background:
  radial-gradient(circle at 50% 40%,var(--accent-soft),transparent 70%);border-radius:12px;padding:6px}
.svgwrap svg{width:100%;max-width:330px;height:auto;display:block}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}
.partcard{display:flex;flex-direction:column;gap:12px}
.partcard .sec h4{margin:0 0 6px;font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.svgwrap .note{color:#DCE6EF;border-left-color:rgba(255,255,255,.35)}
.partfn{font-size:15.5px;color:var(--fg)}
.whymatters{border:1px solid var(--line);border-radius:10px;padding:2px 12px;background:var(--surface-2)}
.whymatters summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--accent-ink);padding:10px 0;list-style:revert}
.whymatters[open] summary{padding-bottom:4px}
.whymatters .clean.checks{padding-bottom:12px}
.whymatters .callout{margin-bottom:12px}
.partlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.partlist button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px;cursor:pointer;text-align:left}
.partlist button:hover{border-color:var(--accent)}
.partlist button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.partlist button[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.partlist .dot{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--ok)}
.partlist .seen .dot{border-color:var(--ok);background:var(--ok-bg)}
.task{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:10px;padding:12px}
.task label{font-size:14px;font-weight:600}
.task input[type=range]{width:100%;accent-color:var(--accent)}
.readout{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:6px;align-items:center;justify-content:space-between}
.stepdots{display:flex;gap:5px}
.stepdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.stepdots i.on{background:var(--accent)}

/* SVG device */
.dv text{font-family:var(--mono);}
.hs{cursor:pointer;outline:none}
.hs .hit{fill:transparent;stroke:transparent;stroke-width:2.5;rx:8}
.hs:hover .hit,.hs:focus-visible .hit{stroke:var(--accent);stroke-dasharray:5 4}
.hs.on .hit{stroke:var(--accent);fill:color-mix(in srgb,var(--accent) 12%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hs:hover .hit,:root:not([data-theme="light"]) .hs:focus-visible .hit,:root:not([data-theme="light"]) .hs.on .hit{stroke:var(--dev-dark)}}
:root[data-theme="dark"] .hs:hover .hit,:root[data-theme="dark"] .hs:focus-visible .hit,:root[data-theme="dark"] .hs.on .hit{stroke:var(--dev-dark)}
.hs.dim{opacity:.35}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.bub{animation:bub 1.3s linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-52px);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:7 7;animation:dash .8s linear infinite}
.flow.past{animation:none;stroke-dasharray:none;opacity:.25}
@keyframes dash{to{stroke-dashoffset:-14}}
.soundchip{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;border-radius:8px;padding:7px 10px;background:var(--surface-2);border:1px solid var(--line)}

/* warnings & scenarios */
.picker{display:flex;gap:6px;flex-wrap:wrap}
.picker button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-size:13.5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.picker button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.picker .done{color:var(--ok);font-weight:700}
.q{display:flex;flex-direction:column;gap:10px}
.q h3{font-size:18px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;cursor:pointer;font-size:15px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;font-family:var(--mono);font-size:12px;font-weight:700;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.partial{border-color:var(--warn);background:var(--warn-bg)}
.opt.faded{opacity:.55}
.patient{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.patient b{font-family:var(--display);font-size:19px}
.vitals{display:flex;gap:8px}
.vital{background:var(--dev-panel);color:#d8f2e2;border-radius:8px;padding:6px 10px;text-align:center;min-width:64px;font-family:var(--mono)}
.vital b{display:block;font-size:20px;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.vital small{font-size:10px;letter-spacing:.08em;opacity:.75}
.vital.low b{color:#ffb4a8}
.vital.mid b{color:#ffd88a}
.timeline{display:flex;flex-direction:column;gap:10px}
.timeline .tl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:14.5px}
.scorebig{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.case{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.case:hover{border-color:var(--accent)}
.case p{font-size:14px;color:var(--muted)}

/* reference */
.ladder{counter-reset:s;display:flex;flex-direction:column;gap:0}
.ladder li{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ladder li:last-child{border-bottom:0}
.ladder li::before{content:counter(s);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);font-family:var(--display);font-weight:800;font-size:17px}
.ladder li:nth-child(2)::before{background:var(--bad);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer;padding:6px 0}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok);flex:none}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.led{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px}
footer{border-top:1px solid var(--line);padding-block:18px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}

.svgwrap.is3d{padding:0;display:block}
.v3slot{width:100%}
.v3{position:relative;width:100%;height:clamp(360px,56vh,560px);border-radius:12px;overflow:hidden;touch-action:none}
.v3 canvas{width:100%;height:100%;display:block;cursor:grab}
.v3 canvas:active{cursor:grabbing}
.v3labels{position:absolute;inset:0;pointer-events:none}
.v3labels span{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;font-weight:600;background:rgba(10,22,36,.78);color:#EAF5F6;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.v3labels span.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.v3sel{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;border:3px solid #FF7A1A;background:rgba(255,122,26,.16);animation:hsPulse 2.2s ease-out infinite;pointer-events:none}
.hs.on .hit{stroke:#FF7A1A;animation:hitPulse 1.6s ease-in-out infinite}
@keyframes hitPulse{0%,100%{stroke-width:2.5;stroke-opacity:1}50%{stroke-width:5;stroke-opacity:.45}}
.v3labels span.v3pick{width:24px;height:24px;padding:0;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;border:2px solid #fff}
.v3tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:700;border-radius:6px;padding:4px 8px;white-space:nowrap}
.v3hint{position:absolute;left:10px;top:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);border-radius:6px;padding:3px 8px;pointer-events:none}
.v3bar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;padding:6px;border-radius:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);backdrop-filter:blur(6px)}
.v3bar button{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.v3bar button{transition:background-color .15s,color .15s}
.v3bar button:hover{background:var(--accent-soft)}
.v3bar button:active,.v3bar button[aria-pressed="true"],.v3bar button[aria-pressed="true"]:hover{background:var(--accent);color:var(--accent-fg)}
.v3sep{width:1px;background:var(--line);margin:2px 3px}
@media (max-width:480px){.v3{height:380px}.v3hint{display:none}.v3bar button{padding:4px 9px;font-size:12px}}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
ol.trail{counter-reset:t;display:flex;flex-direction:row;flex-wrap:wrap;gap:6px}

.readings{display:flex;flex-direction:column;gap:6px}

.chip{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--surface);border:1px solid var(--line);font-family:var(--mono)}
.slots{display:flex;flex-direction:column;gap:6px}

.slot.doing{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.slot.right{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.slot.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.slot.partial{border-style:solid;border-color:var(--warn);background:var(--warn-bg)}
.cardpool{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.pcard{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;box-shadow:0 1px 0 var(--line)}

.refbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}

.journey{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.jgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.jicon{color:var(--accent);display:inline-flex}
.strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.strip-l{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;cursor:pointer;font-family:var(--display);font-size:17px;font-weight:750;color:var(--fg)}

.scard-score{font-size:13px;color:var(--muted);padding:3px 10px;border-radius:999px;background:var(--surface-2)}

.learn-screen{gap:var(--s5)}
.learn-cta{font-size:16px;padding:12px 22px;border-radius:12px}

.stp-opt{display:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;padding:2px 6px;border-radius:999px;background:rgba(255,255,255,.12);color:#DCE6EF}

.learn-cta .opt-tag,.learn-cta:hover .opt-tag{transform:none;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;padding:4px 8px;border-radius:999px;background:rgba(4,30,36,.28);color:#fff}
.flag-note{display:flex;gap:8px;align-items:flex-start;margin:var(--s3) 0 0;padding:var(--s2) var(--s3);border-left:3px solid var(--amber);background:var(--warn-bg);border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.45;color:var(--fg)}
.flag-note strong{color:var(--warn)}
.ref-sec h3{margin-bottom:4px}
.ref-sec > p.small{margin-bottom:8px}
.ref-sec .ladder li > div{min-width:0}
.ref-sec .ladder p{margin-top:2px}
.ref-more{margin-top:4px}
.ref-more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent-ink);padding:4px 0;list-style:revert}
.ref-more p{font-size:13.5px;color:var(--muted);line-height:1.5;padding-bottom:2px}
.lights{display:flex;flex-direction:column;gap:10px}
.light{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:12px 14px;background:var(--surface)}
.light-h{line-height:1.45}
.light-h strong{margin-right:4px}
.light-a{margin-top:4px;font-weight:600;line-height:1.45}
.lights .led{width:12px;height:12px}
.flag-note.slim{font-size:13px;padding:6px 10px;margin-top:14px}
.ref-ticks{margin-bottom:calc(-1 * var(--s3))}
.optwrap{position:relative}
.optmenu{position:absolute;right:0;top:calc(100% + 8px);width:220px;z-index:40}
.optmenu button{color:var(--fg);font-weight:500}
#resetDlg{border:0;border-radius:16px;padding:var(--s5);max-width:440px;width:calc(100% - 32px);background:var(--surface);color:var(--fg);box-shadow:0 24px 60px rgba(0,0,0,.35)}
#resetDlg::backdrop{background:rgba(10,22,36,.55)}
#resetDlg h2{font-size:22px;margin-bottom:var(--s3)}
#resetDlg p{color:var(--muted);line-height:1.5}
.dlg-actions{justify-content:flex-end;margin-top:var(--s5)}
.btn.danger{background:var(--bad);color:#fff}
.btn.danger:hover{background:var(--bad);filter:brightness(.9)}
.illus-note{display:inline-block;align-self:flex-start;margin:4px 0 0;padding:3px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:13px;color:var(--fg);line-height:1.4}
.model-note{margin:0;font-size:13px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.illus-note strong{color:var(--accent-ink)}
.pill.illus{background:var(--warn-bg);color:var(--warn);border:1px dashed var(--amber);text-transform:none;letter-spacing:0;font-weight:600}
.strip-sep{align-self:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 4px 0 8px;border-left:1px solid var(--line);white-space:nowrap}
.stepcards{display:flex;flex-direction:column;gap:10px;max-width:820px}
.stepcard{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer}
.stepcard:hover{border-color:var(--accent)}
.stepcard .sn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);font-family:var(--display);font-weight:800}
.stepcard .st{display:flex;flex-direction:column;gap:2px;min-width:0}
.stepcard .st b{font-family:var(--display);font-size:19px}
.stepcard .st span{font-size:14px;color:var(--muted)}
table.rec td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.callout.slim{padding:8px 12px;font-size:14.5px}

.pill.state{background:var(--accent-soft);color:var(--accent-ink)}
table.rec .linkbtn{text-align:left}
table.rec .obj{white-space:nowrap}
.rec-next{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.rec-key{margin-top:8px}
@media (max-width:640px){

}
.realslot{width:100%}
.v3r{position:relative;display:flex;flex-direction:column;width:100%;height:clamp(400px,60vh,600px);border-radius:12px;overflow:hidden;touch-action:none;background:radial-gradient(ellipse 70% 60% at 50% 38%,var(--surface) 0%,var(--surface-2) 58%,var(--line) 140%)}
.v3r-stage{position:relative;flex:1;min-height:0}
.v3r canvas{width:100%;height:100%;display:block;cursor:grab;opacity:0;transition:opacity .5s}
.v3r.is-ready canvas{opacity:1}
.v3r canvas:active{cursor:grabbing}
.v3r canvas:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.v3r-ov{position:absolute;inset:0;display:none;place-items:center;padding:16px}
.v3r-ov.show{display:grid}
.v3r-ov.flat{background:var(--surface);gap:10px;align-content:center;justify-items:center}
.v3r-ov.flat svg{max-height:300px;width:auto;max-width:100%}

.v3r-poster svg{width:96px;height:auto;opacity:.8}
.v3r-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}
.v3r-prog{width:100%;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.v3r-prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.v3r-hint{position:absolute;left:10px;top:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);border-radius:6px;padding:3px 8px;pointer-events:none}
.v3r-bar{position:relative;display:flex;gap:4px;padding:6px;border-top:1px solid var(--line);background:var(--surface)}
.v3r-bar{flex-wrap:wrap;justify-content:center;align-items:center}
.v3r-bar .sep{width:1px;background:var(--line);margin:4px 2px}
.v3r-bar{gap:3px}
.v3r-bar button.t{width:auto;padding:0 8px;font-size:12px;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;height:32px;align-self:center;background:var(--surface)}
.v3r-bar button.t:hover{background:var(--accent-soft)}
.v3r-bar button.t:active,.v3r-bar button.t[aria-pressed="true"],.v3r-bar button.t[aria-pressed="true"]:hover{background:var(--accent);color:var(--accent-fg)}

.v3r-labels{position:absolute;inset:0;pointer-events:none}
.v3r-labels span{position:absolute;left:0;top:0;white-space:nowrap;font-size:11.5px;font-weight:700;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.v3r-lines{position:absolute;inset:0;overflow:visible}
.v3r-lines line{stroke:var(--fg);stroke-width:1.2;opacity:.55}
.v3r-lines circle{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.v3r-hsl{position:absolute;inset:0;pointer-events:none}
.v3r-hs{position:absolute;left:0;top:0;width:30px;height:30px;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;display:grid;place-items:center;border-radius:50%}

.v3r-bar button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.v3r-bar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* ===== Immersive redesign: tokens, top bar, title screen, full-screen stage, status circles ===== */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--topbar-h:60px;--navy:#14283F;
  --stage-bg:radial-gradient(120% 90% at 50% 35%,#2b4b6b 0%,#1c3651 45%,#14283F 75%,#0f2033 100%)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:#F7FAFC;border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:none}
.topin{height:var(--topbar-h);display:flex;align-items:center;gap:var(--s4);padding-inline:var(--s4)}
.top .brand{color:#F7FAFC;gap:var(--s2);flex:none}
.top .brand .mark{width:32px;height:32px;border-radius:8px;background:#087F8C;color:#fff;font-size:14px}
.top .brand b{font-family:var(--display);font-size:15px;font-weight:700;white-space:nowrap}
.stepper{flex:1;display:flex;align-items:center;justify-content:center;gap:var(--s1);min-width:0}
.stp{display:flex;align-items:center;gap:var(--s2);border:0;background:none;color:#B8C7D6;padding:6px 10px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap}
.stp:hover{color:#fff;background:rgba(255,255,255,.07)}
.stp.on{color:#fff}
.stp-line{flex:0 1 36px;height:2px;background:rgba(255,255,255,.18);border-radius:2px;min-width:10px}
.topr{display:flex;align-items:center;gap:var(--s2);flex:none}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;color:#DCE6EF;cursor:pointer}
.iconbtn:hover,.iconbtn[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.top .lang{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
.top .lang button,.ts-lang button{color:#B8C7D6}
.top .lang button[aria-pressed="true"],.ts-lang button[aria-pressed="true"]{background:#F7FAFC;color:var(--navy)}
.ovring{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#DCE6EF;margin-right:var(--s1)}
.ovring{position:relative;border-radius:6px}
.ovring:focus-visible{outline:2px solid #5CC6D0;outline-offset:2px}
.ring{width:22px;height:22px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:rgba(255,255,255,.2);stroke-width:3}
.ring circle.v{stroke:#5CC6D0;stroke-linecap:round}
.top :focus-visible,.title-screen :focus-visible,.xstage :focus-visible{outline:2px solid #5CC6D0;outline-offset:2px}
/* status circles: one size system, SVG check always centred */
.sc{flex:none;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;border:2px solid currentColor;font-size:12px;font-weight:700;line-height:1;box-sizing:border-box}
.sc.lg{width:32px;height:32px;font-size:14px;border-color:var(--line);color:var(--fg);background:var(--surface)}
.sc.sm{width:20px;height:20px;font-size:11px}
.sc.cur{background:#5CC6D0;border-color:#5CC6D0;color:var(--navy)}
.sc.skip{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.sc.done{background:var(--ok);border-color:var(--ok);color:#fff}
.stp .sc.done{background:#5CC6D0;border-color:#5CC6D0;color:var(--navy)}
.ck{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}
.sc.lg .ck{width:14px;height:14px}
.chip{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;box-sizing:border-box}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.warn{background:var(--amber);border-color:var(--amber);color:var(--navy)}
.partlist .dot{width:20px;height:20px;border-width:2px;box-sizing:border-box}
.partlist .seen .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.partlist .dot .ck{width:10px;height:10px}
/* activity line (replaces the pill strip) */
.actline{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding-bottom:var(--s3);margin-bottom:var(--s5);border-bottom:1px solid var(--line)}
.actline-st{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:15px;color:var(--fg)}
.actline-st .jicon{color:var(--accent)}
.actline-pos{color:var(--muted);font-size:14px;flex:1;min-width:0}
.actline-pos b{color:var(--fg);font-weight:600}
.actline-nav{display:flex;gap:var(--s2)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
/* spacing scale on shared components */
.panel{padding:var(--s5)}
.btn{padding:10px var(--s4)}
.opt{padding:var(--s3) var(--s4)}
.callout{padding:var(--s3) var(--s4)}
.readings li{padding:var(--s2) var(--s3);align-items:center}
.stepcard{padding:var(--s4);gap:var(--s4)}
/* title screen */
body.is-title .top,body.is-title footer,body.is-stage footer{display:none}
body.is-title main.wrap,body.is-stage main.wrap{max-width:none;padding:0}
.title-screen{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--stage-bg);color:#F7FAFC;overflow:hidden;padding:var(--s5) clamp(16px,5vw,72px)}
.title-screen::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-35%;height:60%;background:radial-gradient(ellipse at center,rgba(8,127,140,.35),transparent 70%);pointer-events:none}
.ts-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.ts-mark{width:40px;height:40px;border-radius:10px;background:#087F8C;color:#fff;font-family:var(--display);font-weight:800;display:grid;place-items:center}
.ts-lang{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.ts-body{flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center;gap:var(--s6);position:relative;z-index:1}
.ts-copy{display:flex;flex-direction:column;align-items:flex-start;max-width:34rem}
.ts-titlock{display:flex;flex-direction:column}
.ts-eyebrow{font-family:var(--body);font-size:clamp(11.5px,.2vw + 10.5px,13px);font-weight:700;letter-spacing:.14em;line-height:1.35;text-transform:uppercase;color:#5CC6D0;margin-bottom:clamp(10px,1vw,14px)}
.ts-copy h1{font-size:clamp(38px,3.6vw + 18px,72px);font-weight:800;line-height:1;letter-spacing:-.025em;color:#fff}
.ts-subtitle{font-size:clamp(17px,.55vw + 14px,22px);font-weight:500;color:#EAF5F6;line-height:1.3;margin-top:clamp(6px,.6vw,10px);text-wrap:balance}
.ts-sub{font-size:clamp(15px,.3vw + 13px,18px);font-weight:500;color:#C9D7E4;line-height:1.5;letter-spacing:.01em;margin-top:clamp(24px,2.4vw,36px);text-wrap:balance}
.ts-cta{align-self:flex-start;margin-top:clamp(20px,2vw,28px);font-size:17px;padding:14px 26px;border-radius:12px;background:#087F8C;box-shadow:0 10px 30px rgba(8,127,140,.35)}
.ts-cta:hover{background:#0a96a5}
.ts-cta span{transition:transform .2s}
.ts-cta:hover span{transform:translateX(3px)}
.ts-model{height:min(74vh,660px);min-height:320px}
.tslot,.tslot .v3r{height:100%}
.ts-flat{display:grid;place-items:center;height:100%}
.ts-flat svg{max-height:100%;width:auto}
.ts-copy>*{animation:tsIn .7s both}
.ts-copy>*:nth-child(2){animation-delay:.08s}
.ts-copy>*:nth-child(3){animation-delay:.16s}
@keyframes tsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* realistic viewer inside the immersive stages */
.tslot .v3r,.xslot .v3r{background:transparent;border-radius:0;height:100%}
.tslot .v3r-bar,.tslot .v3r-hint,.xslot .v3r-bar,.xslot .v3r-hint{display:none}
/* full-screen explore stage */
.xstage{position:relative;height:calc(100vh - var(--topbar-h));height:calc(100dvh - var(--topbar-h));min-height:440px;background:var(--stage-bg);overflow:hidden;color:#F7FAFC}
.xslot{position:absolute;inset:0}
.xhint{position:absolute;top:var(--s5);left:50%;transform:translateX(-50%);margin:0;padding:8px 16px;border-radius:999px;background:rgba(10,22,36,.55);border:1px solid rgba(255,255,255,.14);color:#EAF5F6;font-size:14px;font-weight:500;backdrop-filter:blur(6px);transition:opacity .5s,transform .5s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.xhint.gone{opacity:0;transform:translate(-50%,-8px)}
.xprog{position:absolute;left:var(--s4);bottom:var(--s4);display:flex;align-items:center;gap:var(--s2);padding:8px 12px;border-radius:12px;background:rgba(10,22,36,.55);border:1px solid rgba(255,255,255,.12);font-size:13px;color:#DCE6EF;backdrop-filter:blur(6px)}
.xprog .sc{color:#8FA6BC}
.xprog .sc.done{background:#5CC6D0;border-color:#5CC6D0;color:var(--navy)}
.xprog .hw{display:contents}
.xprog-hw{display:inline-flex;align-items:center;gap:var(--s2);border:0;background:none;color:inherit;font:inherit;padding:2px 4px;margin:-2px -4px;border-radius:6px;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:3px}
.xprog-hw:hover{color:#fff;background:rgba(255,255,255,.08)}
.xprog .sep{width:1px;height:16px;background:rgba(255,255,255,.2);margin:0 4px}
.xmenu-wrap{position:absolute;right:var(--s4);bottom:var(--s4);display:flex;flex-direction:column;align-items:flex-end;gap:var(--s2)}
.xmenu-btn{order:2;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(10,22,36,.6);color:#F7FAFC;font-weight:600;font-size:14px;cursor:pointer;backdrop-filter:blur(6px)}
.xmenu-btn:hover,.xmenu-btn[aria-expanded="true"]{background:#087F8C;border-color:#087F8C}
.xmenu{order:1;width:270px;max-width:calc(100vw - 32px);max-height:calc(100% - 80px);overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:var(--s3);box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:var(--s1);animation:xUpS .2s ease-out}
.xmenu[hidden]{display:none}
.xmenu-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:var(--s2) var(--s2) 2px}
.xmenu-row{display:flex;gap:var(--s1);flex-wrap:wrap}
.xmenu button{flex:1;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--fg);cursor:pointer}
.xmenu-row button{text-align:center;background:var(--surface-2)}
.xmenu button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.xmenu button[aria-checked="true"]{background:var(--accent);color:#fff}
.xmenu .xmenu-off{opacity:.75;cursor:help;display:flex;flex-direction:column;gap:2px}
.xmenu .xmenu-off small{font-size:11.5px;color:var(--muted);line-height:1.35}
@keyframes xUpS{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.xpanel{position:absolute;top:var(--s4);right:var(--s4);bottom:76px;width:min(400px,calc(100% - 32px));overflow:auto;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:xIn .35s cubic-bezier(.2,.7,.2,1);z-index:3}
.xpanel{color:var(--fg)}
.xpanel .panel{border:0;min-height:100%;border-radius:16px;color:var(--fg)}
@keyframes xIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.xdone{position:absolute;left:50%;bottom:calc(var(--s4) + 60px);transform:translateX(-50%);display:flex;align-items:center;gap:var(--s3);padding:8px 8px 8px 14px;border-radius:14px;background:var(--surface);color:var(--fg);box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:2}
/* screen transitions */
.view.enter,.xstage.enter,.title-screen.enter{animation:viewIn .35s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* chapter screens and navy behind every 3D or drawn device */
.view.chapter{max-width:820px;margin-inline:auto}
.view.chapter .head h2,.head.page-head h2{font-size:clamp(30px,4vw,42px)}   /* stage overview screens and the Competency record share one main-heading size */
.svgwrap{background:var(--stage-bg)}
.v3hint{background:rgba(10,22,36,.55);color:#DCE6EF}
@media (max-width:820px){.ts-body{grid-template-columns:1fr;gap:var(--s4);align-content:center}.ts-model{order:-1;height:42vh;min-height:260px}.ts-copy{max-width:none}}
@media (max-width:700px){
  .xpanel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62%;border-radius:18px 18px 0 0;animation-name:xSheet}
  .xpanel .panel{border-radius:18px 18px 0 0}
  .xprog{left:var(--s3);bottom:var(--s3);font-size:12px;padding:6px 10px}
  .xmenu-wrap{right:var(--s3);bottom:var(--s3)}
  .xdone{bottom:64px;flex-wrap:wrap;justify-content:center;width:calc(100% - 24px)}
  .stp-l,.top .brand b,.ovring span,.top .brand,.xprog .hw{display:none}
  .stepper{justify-content:flex-start}
  .ovring{display:none}
  .xhint{white-space:normal;text-align:center;width:calc(100% - 32px);border-radius:14px}
  .stp{padding:4px}
  .stp-line{flex-basis:12px}
  .topin{gap:var(--s2);padding-inline:var(--s3)}
  .actline-nav{width:100%;justify-content:space-between}
}
@keyframes xSheet{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .hero .device-mini{max-width:200px;order:-1}
  .hero .device-mini.real{max-width:none;order:0}
  .bench{grid-template-columns:1fr}
  .stagebox{position:static}
  /* Device panel stays in view next to the question (warning drills, bedside cases, bedside decisions). */
  .bench.devfocus .stagebox{position:sticky;top:var(--toph,100px);z-index:6;padding:8px;gap:6px;box-shadow:0 6px 14px -8px rgba(20,40,63,.35)}
  .bench.devfocus .svgwrap{padding:6px}
  .bench.devfocus .svgwrap svg{max-height:28vh;width:auto;max-width:100%}
  .bench.devfocus .v3{height:30vh;min-height:200px}
  /* Warning drills: drawing on the left, sound and note on the right, so the pinned panel stays short. */
  .bench.devfocus .stagebox:has(.soundchip){display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);align-items:center;column-gap:10px}
  .bench.devfocus .stagebox:has(.soundchip) .svgwrap{grid-row:1 / span 2}
  .bench.devfocus .stagebox:has(.soundchip) .svgwrap svg{max-height:24vh}
  .bench.devfocus .stagebox:has(.soundchip) .row{flex-direction:column;align-items:flex-start;gap:6px}
  .bench.devfocus .stagebox:has(.soundchip) .soundchip{font-size:12.5px;padding:5px 8px}
  .bench.devfocus .stagebox:has(.soundchip) .model-note{font-size:12px;line-height:1.35}
/* Short screens (phones held sideways): pinning would cover most of the view. */
@media (max-width:860px) and (max-height:599px){.bench.devfocus .stagebox{position:static;box-shadow:none}}
  .overall .bar{width:70px}
}
@media (max-width:480px){
  .patient{grid-template-columns:1fr}
  .vital{min-width:56px;padding:5px 8px}
  .brand small{display:none}
}
/* ===== Course stepper refinement: lighter labels, 44px targets, no overlap on tablets ===== */
.stp{font-weight:500;min-height:44px;padding:0 10px}
.stp-opt{font-size:10px;font-weight:600;padding:1px 6px;background:rgba(255,255,255,.07);color:#C9D7E4}
.iconbtn{width:44px;height:44px}
/* the brand name hides visually (still read by screen readers) where it would collide with the stepper */
@media (max-width:1279px){.top .brand b{position:absolute;display:block;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}}
@media (max-width:1439px){html[lang="fr"] .top .brand b{position:absolute;display:block;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}}
/* tablets: inactive stages show only their number; the current stage keeps its label */
@media (max-width:1023px){
  .stp:not(.on) .stp-l{display:none}
  .stp:not(.on){min-width:44px;padding:0;justify-content:center}
  .stp-line{flex:0 1 20px}
}
/* phones: the stepper gets its own row so every target can stay 44px */
@media (max-width:700px){
  :root{--topbar-h:101px}
  .topin{flex-wrap:wrap;height:auto;row-gap:2px;padding-block:6px 4px}
  .top .brand{display:flex}
  .top .brand b{position:absolute;display:block;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .topr{margin-left:auto}
  .stepper{order:3;flex:1 0 100%;justify-content:center}
  .top .stp.on .stp-l{display:block}
  .stp.on{padding:0 10px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top">
  <div class="topin">
    <button class="brand" data-go="title"><span class="mark">O₂</span><b id="brandT">OxygenSafe</b></button>
    <nav class="stepper" id="tabs" aria-label="Learning stages"></nav>
    <div class="topr">
      <span class="ovring" id="ovRing" role="img" tabindex="0"></span>
      <button class="iconbtn" id="mapB" data-go="home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></button>
      <button class="iconbtn" id="refB" data-go="reference"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg></button>
      <div class="lang" role="group" aria-label="Language / Langue"><button data-lang="en" lang="en" aria-pressed="true">EN</button><button data-lang="fr" lang="fr" aria-pressed="false">FR</button></div>
      <div class="optwrap">
        <button class="iconbtn" id="optB" aria-haspopup="menu" aria-expanded="false" aria-controls="optMenu"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
        <div class="xmenu optmenu" id="optMenu" role="menu" hidden><button role="menuitem" id="resetItem"></button></div>
      </div>
    </div>
  </div>
</header>
<main class="wrap" id="main" tabindex="-1"></main>
<dialog id="resetDlg" aria-labelledby="resetT" aria-describedby="resetP">
  <h2 id="resetT"></h2>
  <p id="resetP"></p>
  <div class="row dlg-actions"><button class="btn quiet" id="resetCancel"></button><button class="btn danger" id="resetOk"></button></div>
</dialog>
<footer class="wrap" id="foot"></footer>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
/* ---------- content ---------- */
const EN_PARTS=[
 {id:"power",view:"front",name:"Power switch and cord",who:"user",
  what:"Turns the compressor on and off. The green light beside it shows mains power is reaching the device.",
  checks:["Plug straight into a grounded wall socket. Avoid extension leads and multi-plug adaptors.","Use a voltage stabiliser where the supply is unstable, if your facility provides one.","After switching on, wait for the purity light to turn green before relying on the device. Warm-up usually takes a few minutes."],
  fault:"No lights after switching on usually means no mains power. Put the patient on backup oxygen first, then check the socket, plug and breaker."},
 {id:"opi",view:"front",name:"Oxygen purity indicator",who:"user",
  what:"Three lights driven by the internal oxygen sensor. They tell you whether the gas leaving the device is concentrated enough to treat with.",
  checks:["Green means purity is in the normal range, typically about 82% oxygen or more.","Yellow means purity is low. Check the patient, then the filter and ventilation, and report it if it persists.","Red means purity is too low to treat. Move the patient to backup oxygen."],
  fault:"Thresholds differ by model. Learn the values printed in the manual for the devices on your ward."},
 {id:"alarm",view:"front",name:"Alarm indicator",who:"user",
  what:"Lights and sounds when the device detects a problem such as power failure, blocked flow, overheating or low purity.",
  checks:["The power-failure alarm runs on a small internal battery, so it sounds even when the mains is off.","Read the display or the lights to see which alarm it is before acting.","Silencing an alarm does not fix it. Check the patient every time."],
  fault:"An alarm you cannot clear with user-level checks means the device comes out of service and goes to biomedical engineering."},
 {id:"hours",view:"front",name:"Display and hour meter",who:"user",

  checks:["Record the hours when you report a fault.","Note any code shown on the display, exactly as written."],
  fault:"A blank display with the power light on suggests an internal fault. Report it."},
 {id:"flowmeter",view:"front",name:"Flowmeter and control knob",who:"user",

  fault:"If the ball will not rise with the knob open, look for kinked tubing, a blocked outlet or a loose humidifier lid."},
 {id:"humidifier",view:"front",name:"Humidifier bottle",who:"user",

 {id:"outlet",view:"front",name:"Oxygen outlet and tubing",who:"user",

  checks:["Trace the tubing from outlet to patient for kinks, knots, crushing under bed wheels and loose joints.","Keep tubing as short as practical.","Replace prongs and tubing per protocol and whenever soiled."],

 {id:"filter",view:"front",name:"Air intake filter",who:"user",

  checks:["Clean it weekly, and more often in dusty rooms. Wash in mild soapy water, rinse, and let it dry completely.","Fit a clean dry spare while one is drying. Never run the device without a filter.","Replace it if torn or if it stays discoloured after washing."],
  fault:"A clogged filter causes overheating and low purity."},
 {id:"vents",view:"front",name:"Ventilation grilles",who:"user",

 {name:"Interrupteur et cordon d'alimentation",what:"Met le compresseur en marche et l'arrête. Le voyant vert à côté indique que le courant du secteur arrive bien à l'appareil.",
  checks:["Branchez directement sur une prise murale reliée à la terre. Évitez les rallonges et les multiprises.","Utilisez un stabilisateur de tension si le courant est instable et si votre établissement en fournit un.","Après la mise en marche, attendez que le voyant de pureté passe au vert avant de compter sur l'appareil. La mise en température prend en général quelques minutes."],
  fault:"Si aucun voyant ne s'allume, le courant n'arrive généralement pas. Passez d'abord le patient sur l'oxygène de secours, puis vérifiez la prise, la fiche et le disjoncteur."},
 {name:"Indicateur de pureté d'oxygène",what:"Trois voyants commandés par le capteur d'oxygène interne. Ils indiquent si le gaz qui sort de l'appareil est assez concentré pour traiter le patient.",
  checks:["Vert : pureté normale, en général environ 82 % d'oxygène ou plus.","Jaune : pureté basse. Vérifiez le patient, puis le filtre et la ventilation, et signalez-le si cela persiste.","Rouge : pureté trop basse pour traiter. Passez le patient sur l'oxygène de secours."],
  fault:"Les seuils varient selon les modèles. Apprenez les valeurs indiquées dans le manuel des appareils de votre service."},
 {name:"Témoin d'alarme",what:"S'allume et sonne quand l'appareil détecte un problème : coupure de courant, débit bloqué, surchauffe ou pureté basse.",
  checks:["L'alarme de coupure de courant fonctionne sur une petite pile interne. Elle sonne même quand le secteur est coupé.","Lisez l'écran ou les voyants pour identifier l'alarme avant d'agir.","Couper le son d'une alarme ne règle pas le problème. Vérifiez le patient à chaque fois."],
  fault:"Une alarme que vos vérifications ne font pas disparaître signifie que l'appareil doit être retiré du service et confié au service biomédical."},
 {name:"Écran et compteur horaire",what:"Affiche le nombre total d'heures de fonctionnement et, sur beaucoup de modèles, un code d'alarme. Le service biomédical s'en sert pour planifier la maintenance.",
  checks:["Notez les heures quand vous signalez une panne.","Notez tout code affiché à l'écran, exactement tel qu'il apparaît."],
  fault:"Un écran vide alors que le voyant d'alimentation est allumé suggère une panne interne. Signalez-la."},
 {name:"Débitmètre et bouton de réglage",what:"Règle le nombre de litres par minute (L/min) d'oxygène qui sortent de l'appareil. La bille monte dans le tube quand le débit augmente.",
  checks:["Lisez le débit au centre de la bille.","Réglez uniquement le débit prescrit par le clinicien et revérifiez-le après tout déplacement ou choc.","Ne dépassez pas le débit maximal de l'appareil. La pureté baisse si vous le faites."],
  fault:"Si la bille ne monte pas alors que le bouton est ouvert, cherchez une tubulure pliée, une sortie bouchée ou un couvercle d'humidificateur mal serré."},
 {name:"Flacon humidificateur",what:"Flacon facultatif qui humidifie l'oxygène. Les bulles montrent que le gaz le traverse.",
  checks:["Utilisez-le quand votre protocole le prévoit. Beaucoup de montages à bas débit avec lunettes nasales n'en ont pas besoin.","Remplissez avec de l'eau propre, distillée ou bouillie puis refroidie, entre les repères MIN et MAX.","Changez l'eau chaque jour, puis lavez et séchez le flacon selon votre protocole.","Vissez bien le couvercle. Un couvercle desserré fuit et le patient reçoit moins d'oxygène."],
  fault:"Pas de bulles alors qu'un débit est réglé signifie généralement une fuite au couvercle ou une obstruction en amont."},
 {name:"Sortie d'oxygène et tubulure",what:"Relie l'appareil aux lunettes nasales ou au masque du patient par une tubulure à oxygène.",
  checks:["Suivez la tubulure de la sortie jusqu'au patient. Cherchez pliures, nœuds, écrasement sous une roue de lit et raccords desserrés.","Gardez la tubulure aussi courte que possible.","Remplacez lunettes et tubulure selon le protocole et dès qu'elles sont souillées."],
  fault:"Une alarme d'absence de débit commence presque toujours ici. Vérifiez toute la ligne avant le reste."},
 {name:"Filtre d'entrée d'air",what:"Filtre amovible en mousse ou en feutre qui empêche la poussière d'entrer. Son entretien est la tâche la plus importante de l'utilisateur.",
  checks:["Nettoyez-le chaque semaine, et plus souvent dans les pièces poussiéreuses. Lavez à l'eau savonneuse douce, rincez et laissez sécher complètement.","Posez un filtre de rechange propre et sec pendant le séchage. Ne faites jamais fonctionner l'appareil sans filtre.","Remplacez-le s'il est déchiré ou reste décoloré après lavage."],
  fault:"Un filtre encrassé provoque une surchauffe et une pureté basse."},
 {name:"Grilles de ventilation",what:"Laissent entrer l'air de refroidissement et sortir l'air chaud et l'azote.",
  checks:["Gardez l'appareil à environ 30 cm des murs, rideaux et draps.","Ne couvrez jamais l'appareil et ne le faites pas fonctionner dans un placard.","Tenez-le à l'abri du soleil direct et loin des sources de chaleur."],
  fault:"Des grilles obstruées déclenchent des alarmes de température et usent le compresseur plus vite."},
 {name:"Carte électronique et capteur d'oxygène",what:"Gère le cycle de la vanne, surveille la pression et la température, et mesure la pureté de l'oxygène avec un capteur interne qui commande les voyants de pureté.",
  checks:["Le personnel biomédical vérifie la pureté avec un analyseur d'oxygène étalonné lors de la maintenance."],
  fault:"Des fausses alarmes répétées, ou un voyant de pureté qui contredit la mesure d'un analyseur, nécessitent un contrôle biomédical."},
 {name:"Ventilateur de refroidissement",what:"Fait circuler l'air de la pièce sur le compresseur puis vers les grilles pour éviter la surchauffe.",
  checks:["De l'extérieur, vous pouvez vérifier que les grilles sont dégagées et que vous entendez le ventilateur."],
  fault:"Un ventilateur en panne provoque des alarmes de température. L'appareil doit être réparé."},
 {name:"Filtre d'entrée du compresseur",what:"Un second filtre, plus fin, qui protège le compresseur après le filtre d'entrée d'air.",
  checks:["Remplacé par le personnel biomédical selon le calendrier de maintenance, guidé par le compteur horaire."],
  fault:"Un filtre d'entrée bouché prive le compresseur d'air et fait baisser la pureté."},
 {name:"Compresseur",what:"Aspire l'air filtré de la pièce et le met sous pression. C'est la principale source de bruit, de chaleur et d'usure.",
  checks:["Signalez tout cognement, grincement ou bruit nettement plus fort que d'habitude."],
  fault:"Un compresseur usé donne une pression basse et une pureté basse."},
 {name:"Vanne de commutation",what:"Envoie l'air comprimé dans un tamis à la fois et purge l'autre. Le sifflement régulier que vous entendez toutes les quelques secondes vient d'elle.",
  checks:["Un sifflement régulier est normal. Un silence ou un rythme irrégulier ne l'est pas."],
  fault:"Une vanne qui coince empêche les tamis d'alterner et la pureté chute."},
 {name:"Tamis moléculaires",what:"Deux colonnes remplies de zéolithe, un minéral qui retient l'azote sous pression et laisse passer l'oxygène. C'est l'adsorption modulée en pression (PSA).",
  checks:["L'humidité abîme la zéolithe. Ne stockez pas et ne faites pas fonctionner l'appareil dans un lieu mouillé ou très humide sans protection."],
  fault:"Des tamis contaminés ou usés donnent une pureté basse persistante."},
 {name:"Réservoir et régulateur",what:"Stocke le gaz enrichi en oxygène et le maintient à pression stable pour que le débit vers le patient soit régulier.",
  checks:["Aucune tâche pour l'utilisateur. Le personnel biomédical contrôle les pressions lors de la maintenance."],
  fault:"Une fuite ou un défaut du régulateur se manifeste par un débit instable ou des alarmes de pression."}
],
AIRFLOW:[
 {t:"L'air de la pièce entre",d:"Le ventilateur et le compresseur aspirent l'air de la pièce à travers le filtre d'entrée d'air et le filtre du compresseur. L'air ambiant contient environ 21 % d'oxygène et 78 % d'azote."},
 {t:"Le compresseur le met sous pression",d:"Le compresseur comprime l'air filtré et le pousse vers la vanne."},
 {t:"Le tamis A retient l'azote",d:"La vanne envoie l'air comprimé dans le tamis A. Sa zéolithe retient l'azote, donc le gaz qui sort en haut est surtout de l'oxygène."},
 {t:"L'oxygène s'accumule dans le réservoir",d:"Le gaz enrichi en oxygène remplit le réservoir. Un régulateur maintient sa pression stable."},
 {t:"Vers le patient",d:"Le capteur de la carte électronique vérifie la pureté. Le gaz passe ensuite par le débitmètre, que vous réglez, puis par l'humidificateur s'il est utilisé, et sort vers les lunettes nasales du patient."},
 {t:"Le tamis B se purge, puis ils alternent",d:"Pendant que le tamis A travaille, le tamis B redescend à basse pression et relâche l'azote retenu par l'échappement. Toutes les quelques secondes, la vanne inverse les tamis. C'est le sifflement que vous entendez."}
],
WARNINGS:[
 {title:"Coupure de courant",context:"Garde de nuit en pédiatrie. Les lumières du service clignotent puis s'éteignent.",sound:"Bips forts intermittents qui continuent",
  q1:{q:"Que vous dit l'appareil ?",o:[
   {t:"Le courant est coupé. Le compresseur s'est arrêté et aucun oxygène n'est produit.",f:"Exact. Le voyant d'alimentation est éteint, la bille est tombée et l'alarme sur pile sonne."},
   {t:"La pureté est basse mais l'oxygène passe encore.",f:"Non. La bille est à zéro et le voyant d'alimentation est éteint. Rien ne passe."},
   {t:"La tubulure est pliée.",f:"Une pliure n'éteindrait pas le voyant d'alimentation. L'appareil n'a plus de courant."},
   {t:"L'appareil est en mise en température.",f:"La mise en température donne un voyant jaune avec l'appareil sous tension. Ici, il n'y a pas de courant."}]},
  q2:{q:"Que faites-vous en premier ?",o:[
   {t:"Je branche le patient sur la bouteille d'oxygène de secours au débit prescrit.",f:"Exact. Assurez d'abord l'oxygène, cherchez la cause ensuite."},
   {t:"Je vérifie la fiche et la prise.",f:"Utile, mais en second. Le patient ne reçoit pas d'oxygène pendant que vous vérifiez."},
   {t:"Je coupe l'alarme et j'attends le retour du courant.",f:"Dangereux. Un enfant sous oxygène peut désaturer en quelques minutes."},
   {t:"Je branche le concentrateur sur une rallonge venant d'une autre pièce.",f:"Dangereux et lent. Les rallonges chauffent avec un concentrateur, et le patient reste sans oxygène en attendant."}]}},
 {title:"Voyant jaune au démarrage",context:"Vous avez allumé le concentrateur il y a une minute pour une nouvelle admission.",sound:"Pas d'alarme sonore",
  q1:{q:"Que vous dit l'appareil ?",o:[
   {t:"Il est encore en mise en température et n'a pas atteint sa pureté complète.",f:"Exact. La plupart des concentrateurs affichent jaune pendant les premières minutes."},
   {t:"Les tamis moléculaires sont en panne.",f:"Trop tôt pour le dire. La pureté est toujours basse juste après l'allumage."},
   {t:"Il y a un problème d'alimentation.",f:"Le voyant d'alimentation est allumé et le débit est normal."},
   {t:"L'humidificateur est vide.",f:"L'eau de l'humidificateur n'influence pas le voyant de pureté."}]},
  q2:{q:"Le patient a besoin d'oxygène tout de suite. Que faites-vous ?",o:[
   {t:"J'utilise la bouteille de secours jusqu'au voyant vert, puis je bascule et je contrôle la SpO₂.",f:"Exact. Ne faites pas attendre un patient hypoxique pendant la mise en température."},
   {t:"Je branche le patient sur le concentrateur tout de suite et je le laisse.",f:"Un peu d'oxygène vaut mieux que rien, mais la pureté est basse pour l'instant. Surveillez la SpO₂ de près ou utilisez la bouteille."},
   {t:"J'éteins et je rallume l'appareil pour accélérer.",f:"Redémarrer relance la mise en température et retarde le traitement."},
   {t:"Je monte le débit à 5 L/min pour compenser la pureté basse.",f:"Ne dépassez jamais la prescription pour compenser. Sur la plupart des appareils, un débit plus élevé fait aussi baisser la pureté."}]}},
 {title:"Pureté basse, jaune",context:"L'appareil fonctionne depuis 6 heures. Le voyant jaune s'est allumé il y a 20 minutes.",sound:"Bip court toutes les quelques secondes sur certains modèles",
  q1:{q:"Que vous dit l'appareil ?",o:[
   {t:"La pureté est passée sous la normale, mais l'appareil produit encore de l'oxygène.",f:"Exact. Sur la plupart des modèles, le jaune est un avertissement, pas une panne."},
   {t:"Tout est normal.",f:"Un voyant jaune après la mise en température n'est pas normal."},
   {t:"L'appareil n'a plus de courant.",f:"Le voyant d'alimentation est allumé et le débit est normal."},
   {t:"La tubulure est bouchée.",f:"La bille est au débit réglé, donc le gaz circule."}]},
  q2:{q:"Que faites-vous en premier ?",o:[
   {t:"Je vérifie le patient : SpO₂, respiration et coloration.",f:"Exact. L'état du patient détermine l'urgence."},
   {t:"J'ouvre le panneau latéral pour regarder les tamis.",f:"Dangereux. Seul le personnel biomédical formé ouvre le boîtier."},
   {t:"Je vérifie le filtre d'entrée d'air et l'espace autour de l'appareil.",f:"Bonne deuxième étape. Un filtre poussiéreux ou des grilles obstruées en sont souvent la cause. Vérifiez d'abord le patient."},
   {t:"J'attends que le voyant passe au rouge.",f:"Dangereux. Une pureté basse peut signifier que le patient est sous-traité."}]}},
 {title:"Pureté basse, rouge",context:"Le voyant rouge est allumé et l'alarme sonne. Le patient est à 2 L/min.",sound:"Bips continus ou rapides",
  q1:{q:"Que vous dit l'appareil ?",o:[
   {t:"La pureté est trop basse pour traiter. Le patient reçoit surtout de l'air ambiant.",f:"Exact. Le rouge signifie qu'on ne peut pas se fier à l'appareil."},
   {t:"L'appareil est en mise en température.",f:"La mise en température donne du jaune, et cet appareil fonctionne déjà."},
   {t:"Le débit est réglé trop bas.",f:"Le débit est aux 2 L/min prescrits. Le problème, c'est la pureté."},
   {t:"L'eau de l'humidificateur doit être changée.",f:"L'eau de l'humidificateur n'influence pas la pureté."}]},
  q2:{q:"Que faites-vous en premier ?",o:[
   {t:"Je passe le patient sur la bouteille de secours au débit prescrit et je contrôle la SpO₂.",f:"Exact. Rétablissez d'abord un vrai apport d'oxygène."},
   {t:"Je nettoie le filtre et je regarde si le voyant change.",f:"Pas en premier. Le patient a besoin d'un oxygène fiable avant le dépannage."},
   {t:"Je monte le débit à 5 L/min.",f:"Dangereux. Un débit plus élevé ne corrige pas la pureté et l'aggrave souvent."},
   {t:"J'étiquette l'appareil hors service.",f:"Oui, mais une fois le patient en sécurité sous oxygène de secours."}]}},
 {title:"Absence de débit",context:"Le bouton est réglé sur 2 L/min mais la bille reste à zéro. L'écran affiche une alarme de débit.",sound:"Bips intermittents",
  q1:{q:"Que vous dit l'appareil ?",o:[
   {t:"L'oxygène est produit mais ne peut pas sortir. Quelque chose bloque la ligne.",f:"Exact. Alimentation et pureté sont normales. Le circuit de sortie est bouché."},
   {t:"Le compresseur est en panne.",f:"La pureté est verte, donc le compresseur fonctionne."},
   {t:"Le courant est coupé.",f:"Le voyant d'alimentation est allumé."},
   {t:"La pureté est basse.",f:"Le voyant de pureté est vert."}]},
  q2:{q:"Que faites-vous en premier ?",o:[
   {t:"Je vérifie le patient, puis je suis la tubulure de la sortie aux lunettes pour trouver une pliure ou un écrasement.",f:"Exact. Une roue de lit sur la tubulure ou un nœud en est la cause habituelle."},
   {t:"Je tourne le bouton jusqu'à ce que la bille monte.",f:"Tourner le bouton ne sert à rien contre une obstruction, et le débit dépassera la prescription une fois débloqué."},
   {t:"J'envoie l'appareil au service biomédical immédiatement.",f:"Seulement si vos vérifications ne trouvent rien. La plupart des alarmes de débit se règlent au chevet."},
   {t:"J'enlève le couvercle de l'humidificateur pour relâcher la pression.",f:"Cela crée une fuite. Vérifiez que le couvercle est bien en place, mais ne l'ouvrez pas en marche."}]}},
 {title:"Température élevée",context:"Après-midi chaud. L'appareil est collé au rideau et le boîtier est chaud au toucher.",sound:"Bips intermittents",
  q1:{q:"Que vous dit l'appareil ?",o:[
   {t:"Il surchauffe, probablement parce que l'air ne circule pas.",f:"Exact. Grilles obstruées, filtre poussiéreux ou pièce trop chaude en sont les causes habituelles."},
   {t:"Le patient a de la fièvre.",f:"L'appareil n'a aucun capteur sur le patient."},
   {t:"La pureté est basse.",f:"La pureté est encore verte. Elle peut baisser si la surchauffe continue."},
   {t:"La tension du secteur est trop élevée.",f:"Cela s'afficherait comme un défaut d'alimentation, pas de température."}]},
  q2:{q:"Que faites-vous en premier ?",o:[
   {t:"Je m'assure que le patient a de l'oxygène, puis j'éloigne l'appareil de 30 cm du rideau et je vérifie le filtre.",f:"Exact. Si l'appareil s'arrête pour se protéger, utilisez l'oxygène de secours."},
   {t:"Je couvre l'appareil d'un linge mouillé pour le refroidir.",f:"Dangereux. L'eau et les grilles couvertes abîment l'appareil."},
   {t:"J'ignore l'alarme, les concentrateurs chauffent toujours.",f:"Beaucoup d'appareils s'arrêtent en cas de surchauffe et le patient se retrouve sans oxygène."},
   {t:"Je l'éteins pendant une heure.",f:"Le patient serait sans oxygène. Utilisez l'oxygène de secours si vous devez l'arrêter."}]}},
 {title:"Pas de bulles",context:"Le débit est réglé sur 2 L/min et les voyants sont verts, mais l'humidificateur ne fait pas de bulles. Vous entendez un sifflement près du couvercle.",sound:"Pas d'alarme. Un sifflement près du couvercle de l'humidificateur",
  q1:{q:"Que vous dit l'appareil ?",o:[
   {t:"L'oxygène s'échappe au couvercle de l'humidificateur au lieu d'aller au patient.",f:"Exact. Les fuites ne déclenchent souvent aucune alarme. Il faut regarder et écouter."},
   {t:"L'eau de l'humidificateur est trop froide.",f:"La température de l'eau n'empêche pas les bulles."},
   {t:"L'appareil est en mise en température.",f:"Le voyant de pureté est vert."},
   {t:"C'est normal, les bulles sont facultatives.",f:"Avec un humidificateur en place et un débit réglé, l'absence de bulles signifie que le gaz ne le traverse pas."}]},
  q2:{q:"Que faites-vous en premier ?",o:[
   {t:"Je remets et je resserre le couvercle, je vérifie son joint et je contrôle les bulles et le débit aux lunettes.",f:"Exact. Contrôlez ensuite la SpO₂ du patient."},
   {t:"J'augmente le débit pour qu'il en passe davantage.",f:"La fuite serait simplement plus importante."},
   {t:"Je retire l'humidificateur et je branche la tubulure directement, sans demander.",f:"Seulement si votre protocole autorise l'absence d'humidification. Réparer le joint est la première chose à faire."},
   {t:"Je remplis le flacon au-dessus du repère MAX.",f:"Trop remplir peut envoyer de l'eau dans la tubulure."}]}}
],
SCENARIOS:[
 {hook:"Le service plonge dans le noir à 2 h et l'oxygène d'un nourrisson s'arrête. Que faites-vous en premier ?",title:"Coupure de nuit",tag:"Alimentation",setting:"Service de pédiatrie, 02 h 10",
  patient:{name:"Bébé Amani",detail:"8 mois, pneumonie sévère. Lunettes nasales à 1 L/min."},
  steps:[
   {text:"Les lumières s'éteignent. L'alarme du concentrateur se met à sonner et la bille du débitmètre tombe.",ch:[
    {t:"Brancher Amani sur la bouteille de secours à 1 L/min.",f:"L'oxygène continue d'arriver. C'est toujours le premier geste quand l'appareil s'arrête."},
    {t:"Aller chercher l'électricien.",f:"Amani resterait sans oxygène pendant votre absence. Rétablissez d'abord l'oxygène, puis demandez à un collègue de signaler la coupure."},
    {t:"Couper l'alarme et attendre quelques minutes le retour du courant.",f:"Les nourrissons sous oxygène peuvent désaturer très vite. Attendre n'est pas sûr."}]},
   {text:"Amani est sur la bouteille à 1 L/min. Sa SpO₂ remonte à 95 %.",ch:[
    {t:"Vérifier le manomètre de la bouteille, noter l'heure et prévenir l'infirmier responsable.",f:"Vous savez combien de temps la bouteille tiendra et l'équipe peut s'organiser si la coupure dure."},
    {t:"Monter la bouteille à 3 L/min par sécurité.",f:"Restez au débit prescrit. Un débit plus élevé vide aussi la bouteille plus vite."},
    {t:"Surveiller Amani sans rien faire d'autre.",f:"Surveiller est juste, mais personne ne sait combien de temps la bouteille tiendra."}]},
   {text:"Le courant revient après 40 minutes. Vous rallumez le concentrateur et le voyant de pureté est jaune.",ch:[
    {t:"Garder Amani sur la bouteille jusqu'au voyant vert, puis basculer et recontrôler la SpO₂.",f:"L'appareil a besoin de quelques minutes pour atteindre sa pureté complète."},
    {t:"Rebrancher Amani directement sur le concentrateur.",f:"Cela fonctionne, mais la pureté est basse pendant la mise en température. Surveillez la SpO₂ de près si vous le faites."},
    {t:"Laisser Amani sur la bouteille pour le reste de la nuit.",f:"Sûr pour l'instant, mais les bouteilles se vident et servent aux urgences."}]}],
  take:"D'abord l'oxygène, ensuite la cause. Sachez où est la bouteille de secours et combien elle contient avant chaque garde de nuit."},
 {hook:"Un voyant est jaune depuis vingt minutes et votre patient semble aller bien. Est-ce vraiment le cas ?",title:"Le voyant jaune",tag:"Pureté basse",setting:"Médecine adultes, 14 h 30",
  patient:{name:"Mr Dunia",detail:"54 ans, pneumonie. Lunettes nasales à 3 L/min. SpO₂ cible de 92 à 96 %."},
  steps:[
   {text:"Le concentrateur tourne depuis 8 heures. Le voyant de pureté est jaune depuis 20 minutes.",ch:[
    {t:"Examiner Mr Dunia : SpO₂, fréquence respiratoire et coloration.",f:"Sa SpO₂ est dans la cible pour l'instant. Vous avez un peu de temps pour chercher la cause."},
    {t:"Monter le débit à 5 L/min.",f:"Ne dépassez jamais la prescription pour compenser une pureté basse. Cela fait généralement encore baisser la pureté."},
    {t:"Éteindre et rallumer l'appareil.",f:"Redémarrer interrompt l'oxygène et relance la mise en température."}]},
   {text:"Vous trouvez l'appareil collé au mur. Le filtre d'entrée d'air est gris de poussière.",ch:[
    {t:"Poser un filtre de rechange propre et sec et éloigner l'appareil de 30 cm du mur.",f:"Ce sont les deux causes de pureté basse les plus fréquentes que l'utilisateur peut corriger."},
    {t:"Retirer le filtre et faire tourner l'appareil sans filtre jusqu'au lavage.",f:"Ne faites jamais tourner l'appareil sans filtre. La poussière va directement dans le compresseur et les tamis."},
    {t:"Ouvrir le panneau latéral pour vérifier les tamis.",f:"Seul le personnel biomédical formé ouvre le boîtier."}]},

function deepMerge(base,over){
  if(over===undefined) return base;
  if(Array.isArray(base)) return base.map((b,i)=>deepMerge(b,Array.isArray(over)?over[i]:undefined));
  if(base&&typeof base==="object"){const o={...base}; for(const k in over) o[k]=deepMerge(base[k],over[k]); return o}
  return over;
}

  function indexParts(obj){
    const fresh=[];

    obj.traverse(o=>{
      if(!o.isMesh||o.userData.indexed) return; o.userData.indexed=true;
      let p=o; while(p&&!p.userData.part) p=p.parent;
      if(p){ o.userData.pid=p.userData.part; parts[o.userData.pid].meshes.push(o) }
      o.userData.base={op:o.material.opacity,em:o.material.emissive?o.material.emissive.clone():null,ei:o.material.emissiveIntensity};
      meshes.push(o);
    });
    root.updateMatrixWorld(true);
    fresh.forEach(id=>{const g=parts[id].groups[0];const c=new T.Box3().setFromObject(g).getCenter(new T.Vector3());parts[id].local=g.worldToLocal(c);parts[id].anchor=g});
  }

    });

    const ray=new T.Raycaster(), v=new T.Vector2(); let down=null;
    const pick=(e)=>{const r=canvas.getBoundingClientRect();v.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(v,camera);
      const cand=meshes.filter(m=>m.visible&&!m.userData.deco&&!(m.userData.shell&&(st.see||st.seeForce||st.mode==="airflow"))&&!(m.userData.hitpad&&st.mode!=="front")&&isShown(m));

      const h=ray.intersectObjects([knobCyl,knobMark],false)[0]; if(!h) return;

      if(st.knob&&id==="flowmeter"){ const r=canvas.getBoundingClientRect(); v.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(v,camera); if(ray.intersectObjects([knobCyl,knobMark],false).length) canvas.style.cursor="grab" }
      if(id&&st.tips){tipEl.hidden=false;tipEl.textContent=itemName(id)+(st.picked.includes(id)?" · "+tx("Selected","Sélectionné"):"");const r=el.getBoundingClientRect();let lx=e.clientX-r.left+14; if(lx+tipEl.offsetWidth>r.width-6) lx=Math.max(6,e.clientX-r.left-14-tipEl.offsetWidth); tipEl.style.left=lx+"px";tipEl.style.top=(e.clientY-r.top+14)+"px"} else tipEl.hidden=true});

V.warnings=()=>{
  const W4=drills(), w=W4.find(x=>x.id===ui.warn)||W4[0]; ui.warn=w.id;
  const a=ui.wq[w.id]||{};
  const optHTML=(qk,q)=>{
    const picked=a[qk];
    return `<div class="opts">${dispOrder(q.o.length,w.id+":"+qk,q.o.findIndex(x=>x.c===1)).map((i,pos)=>{ const o=q.o[i];
      let cls=""; if(picked!=null){ if(o.c===1) cls="right"; else if(i===picked) cls=o.c===2?"partial":"wrong"; else cls="faded"}
      return `<button class="opt ${cls}" data-wq="${qk}" data-i="${i}" ${picked!=null?"disabled":""}><span class="k">${"ABCD"[pos]}</span><span>${o.t}</span></button>`}).join("")}</div>
      ${picked!=null?(()=>{const o=q.o[picked];const best=q.o.find(x=>x.c===1);
        // the heading carries the verdict, so a repeated verdict at the start of the feedback is dropped
        const vm=o.f.match(/^(Right|Unsafe and slow|Unsafe|Not first|Worth doing, but second|No|Exact|Dangereux et lent|Dangereux|Pas en premier|Utile, mais en second|Non)\.\s*/), fb=vm?o.f.slice(vm[0].length):o.f, unsafe=vm&&/^(Unsafe|Dangereux)/.test(vm[1]);
        return `<div class="callout ${o.c===1?"ok":o.c===2?"warn":"bad"}" aria-live="polite"><strong>${o.c===1?tx("Correct.","Exact."):o.c===2?tx("Close, but not first.","Presque, mais pas en premier."):unsafe?tx("Unsafe.","Dangereux."):tx("Not quite.","Pas tout à fait.")}</strong> ${fb}${o.c!==1?`<span class="vh"> ${tx("Best answer:","Meilleure réponse :")} ${best.t}</span>`:""}</div>`})():""}`;
  };
  const doneBoth=a.q1!=null&&a.q2!=null;
  const idx=W4.indexOf(w);
  return `<div class="view">
  <div class="head"><h2>${tx("Warning drills","Exercices d'alertes")}</h2><p class="muted">${tx("Each card shows the device as you would find it. Decide what it means, then what you do first.","Chaque carte montre l'appareil tel que vous le trouveriez. Décidez ce que cela signifie, puis ce que vous faites en premier.")}</p></div>
  <div class="picker" role="group" aria-label="${tx("Warnings","Alertes")}">${W4.map((x,i)=>{const shown=S.warn[x.id]!=null||(ui.wq[x.id]&&ui.wq[x.id].q1!=null);   // the title names the answer to question 1, so it stays hidden until then
    return `<button data-warn="${x.id}" aria-pressed="${x.id===w.id}">${S.warn[x.id]!=null?'<span class="done">✓</span>':`<span class="muted">${i+1}</span>`}${shown?x.title:tx("Warning","Alerte")}</button>`}).join("")}</div>
  <div class="bench devfocus">
    <section class="stagebox">
      <div class="svgwrap">${deviceSVG({st:{...OK_STATE,...w.st},interactive:false,label:tx("Simulated device state: ","État simulé de l'appareil : ")+stateDesc(w.st)})}</div>
      <div class="row"><span class="soundchip"><span aria-hidden="true">🔊</span>${w.sound}</span>${w.tone?`<button class="btn quiet" data-tone="${w.tone}">${tx("Play alarm","Écouter l'alarme")}</button>`:""}</div>
      ${modelNote()}
    </section>
    <div class="info">
      <div class="panel q"><span class="eyebrow">Situation</span><p>${w.context}</p></div>
      <div class="panel q"><h3>1. ${w.q1.q}</h3>${optHTML("q1",w.q1)}</div>
      ${a.q1!=null?`<div class="panel q"><h3>2. ${w.q2.q}</h3>${optHTML("q2",w.q2)}</div>`:""}
      ${doneBoth?`<div class="row">${idx<W4.length-1?`<button class="btn" data-warn="${W4[idx+1].id}">${tx("Next warning","Alerte suivante")}</button>`:`<button class="btn" data-go="scenarios">${tx("Go to Bedside cases","Aller aux cas au chevet")}</button>`}<button class="btn quiet" data-wreset="${w.id}">${tx("Try again","Recommencer")}</button></div>`:""}
    </div>
  </div></div>`;
};

    return `<div class="view">

  }
  const sc=SCENARIOS.find(s=>s.id===ui.scen);
  if(ui.sStep>=sc.steps.length){
    const pts=ui.sPicks.reduce((t,p,i)=>t+({best:2,ok:1,unsafe:0})[sc.steps[i].ch[p].g],0);

    <div class="bench"><section class="panel" style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
      <span class="scorebig">${score} %</span><p class="muted">${tx("Safety score for this case","Score de sécurité pour ce cas")}</p>
      <div class="callout info"><strong>${tx("Key lesson.","À retenir.")}</strong> ${sc.take}</div>
